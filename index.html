<title>지원 키친</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
  /* Layout: one-screen game. Top bar (recipe + step dots), square-ish canvas stage with overlay cards, host character row at the bottom.
     Single committed look: "숲속 오두막" — moss-green cabin walls, cream paper cards, lantern-yellow buttons. */
  :root {
    --moss: #24392d;
    --moss-2: #2f4a3a;
    --moss-3: #3b5c48;
    --paper: #f1ead6;
    --paper-2: #f8f3e4;
    --paper-line: #e3d7b8;
    --paper-dash: #b8a983;
    --ink: #2a3326;
    --ink-soft: #6b6a55;
    --cream-text: #f1ead6;
    --cream-soft: #b9c7a8;
    --lantern: #f2b544;
    --lantern-dark: #c98f1f;
    --leaf: #4f7d45;
    --ember: #c4552f;
    --font-display: "Gowun Batang", "Apple SD Gothic Neo", serif;
    --font-body: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background-color: var(--moss);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(242,181,68,0.10), transparent 32%),
      radial-gradient(circle at 85% 90%, rgba(159,194,138,0.10), transparent 36%);
    color: var(--cream-text);
    font-family: var(--font-body);
    font-size: 16px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    overflow: hidden;
  }
  .app {
    height: 100%;
    max-width: 760px; margin: 0 auto;
    padding: 0 16px; padding-block: 12px;
    display: grid; grid-template-rows: auto 1fr auto; gap: 12px;
    box-sizing: border-box;
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .brand-row svg { width: 40px; height: 40px; flex: none; }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1; }
  .recipe { color: var(--cream-soft); font-size: 0.9rem; margin-top: 3px; }
  .top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .music-btn { font-family: var(--font-body); font-weight: 700; font-size: 0.9rem; padding: 7px 14px; border-radius: 12px; color: var(--moss); background: var(--lantern); border: 0; box-shadow: none; }
  .music-btn:not(.on) { background: var(--moss-2); color: var(--cream-soft); }
  .music-btn:active { transform: none; box-shadow: none; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 7px; align-items: center; }
  .steps li {
    width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box;
    border: 2px solid #6f8a6a; font-size: 0; overflow: hidden;
  }
  .steps li.current { border-color: var(--lantern); }
  .steps li.done { background: var(--lantern); border-color: var(--lantern); }

  .stage-wrap { min-height: 0; display: grid; place-items: center; }
  .stage {
    position: relative;
    width: min(100%, 640px, calc((100dvh - 210px) * 1.25));
    aspect-ratio: 5 / 4; max-width: 100%;
    border-radius: 22px; overflow: hidden;
    background: var(--paper);
    box-shadow: inset 0 0 0 6px var(--paper-line), 0 10px 24px rgba(0,0,0,0.25);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute; inset: 0;
    display: flex;
    background: rgba(36, 57, 45, 0.55);
    padding: 16px; overflow-y: auto;
  }
  .overlay[hidden] { display: none; }
  .card {
    background: var(--paper); color: var(--ink); border-radius: 18px;
    padding: 20px 22px; width: min(100%, 360px);
    display: grid; gap: 10px; text-align: center;
    box-shadow: inset 0 0 0 6px var(--paper-line), 0 8px 20px rgba(0,0,0,0.25);
    box-sizing: border-box; margin: auto;
  }
  .card.wide { width: min(100%, 440px); }
  .card h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; margin: 0; text-wrap: balance; }
  .card p { margin: 0; color: var(--ink-soft); line-height: 1.5; }
  .card .rule { font-size: 0.82rem; color: var(--ink-soft); background: var(--paper-2); border: 1px dashed var(--paper-dash); border-radius: 10px; padding: 8px 10px; line-height: 1.45; }
  .eyebrow { font-family: var(--font-body); font-size: 0.8rem; letter-spacing: 0.12em; color: var(--leaf); }
  .big { font-family: var(--font-display); font-weight: 700; font-size: 3rem; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .detail { font-size: 0.92rem; color: var(--ink-soft); }
  .scores { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; text-align: left; }
  .scores li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 1px dashed var(--paper-dash); padding: 5px 0; }
  .scores li span { min-width: 0; }
  .scores small { display: block; font-size: 0.78rem; color: var(--ink-soft); }
  .scores b { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
  .medal {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 auto;
    display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--ink);
    border: 4px solid var(--paper); box-shadow: 0 0 0 3px var(--moss-2);
  }
  .grade { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--leaf); }
  button {
    font-family: var(--font-body); font-weight: 700; font-size: 1.15rem;
    color: var(--moss); background: var(--lantern);
    border: 0; border-radius: 12px; padding: 12px 18px;
    box-shadow: 0 4px 0 var(--lantern-dark);
    cursor: pointer;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--lantern-dark); }
  button:focus-visible { outline: 3px solid var(--moss); outline-offset: 3px; }
  button.ghost { background: var(--paper-2); color: var(--ink); box-shadow: none; border: 1.5px solid var(--paper-dash); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row button { flex: 1 1 140px; }

  .card.menu-card { width: min(100%, 600px); padding: 16px; gap: 10px; }
  .menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .chip { font-size: 0.9rem; font-weight: 400; padding: 6px 14px; border-radius: 999px; color: #4f5a45; background: transparent; border: 1.5px solid var(--paper-dash); box-shadow: none; }
  .chip.on { background: var(--moss-2); border-color: var(--moss-2); color: var(--cream-text); }
  .chip:active { transform: none; box-shadow: none; }
  .dish {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    text-align: center; color: var(--ink); background: var(--paper-2);
    border: 1.5px dashed var(--paper-dash); box-shadow: none; border-radius: 16px;
    padding: 12px 8px 10px; min-width: 0;
  }
  .dish:active { transform: none; background: var(--paper-line); }
  .dish canvas { width: 56px; height: 56px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--paper-line); }
  .dish-name { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; display: block; line-height: 1.2; }
  .dish-meta { font-family: var(--font-body); font-weight: 400; font-size: 0.78rem; color: var(--ink-soft); display: block; }
  .dish-meta b { font-family: var(--font-display); font-weight: 700; color: var(--ember); font-variant-numeric: tabular-nums; }

  .host { display: flex; align-items: center; gap: 12px; }
  .host svg { flex: none; width: 60px; height: 60px; }
  .bubble {
    position: relative; min-width: 0; flex: 1;
    background: var(--paper); color: var(--ink); border-radius: 18px; padding: 11px 16px;
    font-size: 1rem; line-height: 1.45;
  }
  .bubble::before {
    content: ""; position: absolute; left: -8px; top: 50%; margin-top: -8px;
    border: 8px solid transparent; border-left: 0; border-right-color: var(--paper);
  }
  /* ambient: breathing lantern, drifting leaf shadows on the paper stage */
  .brand-row svg { filter: drop-shadow(0 0 6px rgba(242,181,68,0.45)); animation: lantern 3.2s ease-in-out infinite; }
  @keyframes lantern { 0%, 100% { filter: drop-shadow(0 0 4px rgba(242,181,68,0.35)); } 50% { filter: drop-shadow(0 0 12px rgba(242,181,68,0.8)); } }
  .stage::after {
    content: ""; position: absolute; inset: -40px; pointer-events: none; mix-blend-mode: multiply; opacity: 0.55;
    background:
      radial-gradient(ellipse 120px 60px at 20% 10%, rgba(60,90,60,0.35), transparent 70%),
      radial-gradient(ellipse 90px 160px at 80% 30%, rgba(60,90,60,0.28), transparent 70%),
      radial-gradient(ellipse 140px 70px at 60% 90%, rgba(60,90,60,0.3), transparent 70%);
    animation: leafshade 9s ease-in-out infinite alternate;
  }
  @keyframes leafshade { from { transform: translate(-14px, 6px) rotate(-1.5deg); } to { transform: translate(14px, -8px) rotate(1.5deg); } }
  .host svg { transform-origin: 50% 90%; }
  .host svg.jump { animation: jump 0.5s ease-out; }
  .host svg.jump2 { animation: jump 0.45s ease-out 2; }
  .host svg.shake { animation: shake 0.4s ease-in-out; }
  @keyframes jump { 0% { transform: translateY(0); } 35% { transform: translateY(-14px) scale(1.04); } 70% { transform: translateY(0) scale(0.97); } 100% { transform: translateY(0); } }
  @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  #hat { transition: transform 0.35s ease; transform-origin: 32px 26px; }
  #sweat, #zz, #stars { transition: opacity 0.2s; }
  .leafbar { display: inline-flex; align-items: center; gap: 4px; padding: 7px 12px; border-radius: 12px; background: var(--moss-2); color: var(--cream-text); font-size: 0.9rem; font-weight: 700; }
  .leafbar svg { width: 16px; height: 16px; }
  .guests { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .guest { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 14px; background: var(--paper-2); border: 1.5px solid var(--paper-line); font-size: 0.8rem; color: var(--ink-soft); }
  .guest svg { width: 44px; height: 44px; flex: none; }
  .guest b { display: block; font-family: var(--font-display); font-size: 0.95rem; color: var(--ink); }
  .guest.locked { opacity: 0.55; }
  .shelf { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; font-size: 0.72rem; color: var(--ink-soft); }
  .shelf span { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 62px; }
  .shelf svg { width: 34px; height: 34px; }
  .shelf .locked svg { opacity: 0.25; filter: grayscale(1); }
  .dish.special { border-style: solid; border-color: var(--lantern); background: #fff6dc; }
  .dish .tag { font-size: 0.7rem; color: var(--moss); background: var(--lantern); border-radius: 999px; padding: 1px 8px; font-weight: 700; }
  .dish.locked { opacity: 0.5; }
  .note { background: #fffdf5; border: 1px solid var(--paper-line); border-radius: 10px; padding: 10px 12px; text-align: left; font-size: 0.9rem; line-height: 1.5; color: var(--ink); box-shadow: 2px 2px 0 var(--paper-line); }
  .note small { display: block; color: var(--leaf); font-weight: 700; margin-bottom: 2px; }
  .tip { font-size: 0.88rem; color: var(--leaf); font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } .brand-row svg, .stage::after, .host svg { animation: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand-row">
      <svg viewBox="0 0 46 46" aria-hidden="true"><path d="M23 4 L40 20 L36 20 L36 40 L10 40 L10 20 L6 20 Z" fill="#8a5a35"/><rect x="19" y="27" width="8" height="13" fill="#f2b544"/><path d="M30 8 q6 -4 10 2" fill="none" stroke="#9fc28a" stroke-width="3" stroke-linecap="round"/></svg>
      <div>
        <div class="brand">지원 키친</div>
        <div class="recipe" id="recipe">메뉴를 골라 주세요</div>
      </div>
    </div>
    <div class="top-right">
      <ol class="steps" id="steps"></ol>
      <span class="leafbar" id="leaves" title="나뭇잎 (손님 팁)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1q9 4 0 18-9-14 0-18z" fill="#7fa86a"/><path d="M10 4v12" stroke="#4f7d45" stroke-width="1.2"/></svg><span> 0</span></span>
      <button id="btn-music" class="music-btn" type="button">♪ 숲길</button>
    </div>
  </header>

  <div class="stage-wrap">
    <div class="stage">
      <canvas id="cv" aria-label="요리 화면"></canvas>
      <div class="overlay" id="ov"></div>
    </div>
  </div>

  <div class="host">
    <svg id="jiwon" viewBox="0 0 64 64" aria-hidden="true">
      <g id="stars" opacity="0">
        <path d="M6 30l1.5 3 3 .5-2.2 2.1.5 3.2L6 37.3 3.2 38.8l.5-3.2L1.5 33.5l3-.5z" fill="#f2b544"/>
        <path d="M57 28l1.5 3 3 .5-2.2 2.1.5 3.2L57 35.3l-2.8 1.5.5-3.2-2.2-2.1 3-.5z" fill="#f2b544"/>
        <path d="M52 50c0-2 3-3 3-1 0-2 3-1 3 1 0 2-3 4-3 4s-3-2-3-4z" fill="#e8738a"/>
      </g>
      <g id="hat">
        <path d="M14 22c-6-1-8-9-2-12 2-6 10-7 13-3 3-5 12-5 15 0 4-3 11-1 11 5 6 2 5 11-1 11z" fill="#fff" stroke="#2a3326" stroke-width="2"/>
        <rect x="16" y="20" width="32" height="6" rx="2" fill="#fff" stroke="#2a3326" stroke-width="2"/>
        <path d="M30 15q2-3 4 0" fill="none" stroke="#7fa86a" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <path d="M17 36q-2-10 6-13 6-3 18 0 8 3 6 13" fill="#8a5a35"/>
      <circle cx="32" cy="42" r="17" fill="#ffd9a8" stroke="#2a3326" stroke-width="2"/>
      <path d="M16 38q3-9 16-9t16 9q-2-5-16-5t-16 5z" fill="#8a5a35"/>
      <path id="browL" d="M21 35q4-2 7 0" fill="none" stroke="#2a3326" stroke-width="1.6" stroke-linecap="round"/>
      <path id="browR" d="M36 35q3-2 7 0" fill="none" stroke="#2a3326" stroke-width="1.6" stroke-linecap="round"/>
      <path id="eyeL" d="M22.8 40a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0 -4.4 0" fill="#2a3326"/>
      <path id="eyeR" d="M36.8 40a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0 -4.4 0" fill="#2a3326"/>
      <ellipse cx="21" cy="47" rx="3" ry="2" fill="#ff9c86"/>
      <ellipse cx="43" cy="47" rx="3" ry="2" fill="#ff9c86"/>
      <path id="mouth" d="M27 47q5 5 10 0" fill="none" stroke="#2a3326" stroke-width="2" stroke-linecap="round"/>
      <path id="sweat" d="M50 36q3 4 0 6q-3-2 0-6z" fill="#8cc6dd" opacity="0"/>
      <text id="zz" x="48" y="22" font-size="9" font-weight="bold" fill="#6b6a55" opacity="0">zZ</text>
    </svg>
    <div class="bubble" id="bubble">안녕하세요! 저는 지원이에요. 오늘은 뭘 만들어 볼까요?</div>
  </div>
</div>

<script>
(() => {
  const W = 500, H = 400;
  const cv = document.getElementById("cv");
  let ctx = cv.getContext("2d");
  const mainCtx = ctx;
  const ov = document.getElementById("ov");
  const bubble = document.getElementById("bubble");
  const mouth = document.getElementById("mouth");
  const stepsEl = document.getElementById("steps");
  const recipeEl = document.getElementById("recipe");

  // Jiwon's expression set: eyes, brows, mouth, hat tilt and extras per mood
  const jiwon = document.getElementById("jiwon");
  const part = id => document.getElementById(id);
  const EYE = {
    open: ["M22.8 40a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0 -4.4 0", "M36.8 40a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0 -4.4 0"],
    closed: ["M22 40q3 2 6 0", "M36 40q3 2 6 0"],
    happy: ["M22 41q3-4 6 0", "M36 41q3-4 6 0"],
    wide: ["M22.2 40a2.8 2.8 0 1 0 5.6 0a2.8 2.8 0 1 0 -5.6 0", "M36.2 40a2.8 2.8 0 1 0 5.6 0a2.8 2.8 0 1 0 -5.6 0"],
    star: ["M25 36.5l1.1 2.3 2.5.3-1.8 1.7.5 2.5-2.3-1.2-2.3 1.2.5-2.5-1.8-1.7 2.5-.3z", "M39 36.5l1.1 2.3 2.5.3-1.8 1.7.5 2.5-2.3-1.2-2.3 1.2.5-2.5-1.8-1.7 2.5-.3z"],
    wink: ["M22 41q3-4 6 0", "M36.8 40a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0 -4.4 0"],
    squint: ["M22 40q3 1 6 0", "M36 40q3 1 6 0"],
    half: ["M22.8 41a2.2 1.2 0 1 0 4.4 0a2.2 1.2 0 1 0 -4.4 0", "M36.8 41a2.2 1.2 0 1 0 4.4 0a2.2 1.2 0 1 0 -4.4 0"],
  };
  const BROW = {
    calm: ["M21 35q4-2 7 0", "M36 35q3-2 7 0"],
    up: ["M21 33q4-3 7-1", "M36 32q3-2 7 1"],
    sad: ["M21 36q3-3 7-3", "M36 33q4 0 7 3"],
    focus: ["M21 36q4-1 7 1", "M36 37q3-2 7-1"],
  };
  const MOUTH = {
    smile: "M27 47q5 5 10 0", big: "M26 46q6 8 12 0", o: "M30 47a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0",
    flat: "M28 48h8", sad: "M27 50q5-4 10 0", wave: "M27 48q2.5-2 5 0t5 0", tiny: "M30 48q2 1 4 0",
  };
  const MOODS = {
    idle:    { eye: "open",   brow: "calm",  mouth: "smile", hat: 0 },
    sleepy:  { eye: "half",   brow: "calm",  mouth: "tiny",  hat: -10, zz: true },
    explain: { eye: "open",   brow: "up",    mouth: "o",     hat: 0 },
    focus:   { eye: "squint", brow: "focus", mouth: "flat",  hat: 0 },
    happy:   { eye: "happy",  brow: "up",    mouth: "big",   hat: 4, anim: "jump" },
    perfect: { eye: "star",   brow: "up",    mouth: "big",   hat: 6, anim: "jump", stars: true },
    combo:   { eye: "wink",   brow: "up",    mouth: "smile", hat: 3 },
    sad:     { eye: "open",   brow: "sad",   mouth: "sad",   hat: -4 },
    fail:    { eye: "wide",   brow: "sad",   mouth: "o",     hat: -14, sweat: true, anim: "shake" },
    cough:   { eye: "closed", brow: "focus", mouth: "wave",  hat: -3, sweat: true },
    present: { eye: "happy",  brow: "calm",  mouth: "smile", hat: 2 },
    touched: { eye: "closed", brow: "up",    mouth: "big",   hat: 5, anim: "jump2", sweat: true },
  };
  const MOOD_ALIAS = { smile: "idle", oops: "sad" };
  let curMood = "idle", blinkTimer = null, sleepTimer = null;
  function setMood(mood) {
    const m = MOODS[MOOD_ALIAS[mood] || mood] || MOODS.idle;
    curMood = MOOD_ALIAS[mood] || mood;
    part("eyeL").setAttribute("d", EYE[m.eye][0]); part("eyeR").setAttribute("d", EYE[m.eye][1]);
    part("browL").setAttribute("d", BROW[m.brow][0]); part("browR").setAttribute("d", BROW[m.brow][1]);
    part("mouth").setAttribute("d", MOUTH[m.mouth]);
    part("hat").style.transform = "rotate(" + (m.hat / 2) + "deg) translateY(" + (m.hat < 0 ? -m.hat * 0.35 : -m.hat * 0.5) + "px)";
    part("sweat").setAttribute("opacity", m.sweat ? 1 : 0);
    part("zz").setAttribute("opacity", m.zz ? 1 : 0);
    part("stars").setAttribute("opacity", m.stars ? 1 : 0);
    jiwon.classList.remove("jump", "jump2", "shake");
    if (m.anim) { void jiwon.offsetWidth; jiwon.classList.add(m.anim); }
  }
  // blink every few seconds while the eyes are open; doze off after a long wait on the menu
  function blink() {
    const m = MOODS[curMood];
    if (m && m.eye === "open") {
      part("eyeL").setAttribute("d", EYE.closed[0]); part("eyeR").setAttribute("d", EYE.closed[1]);
      setTimeout(() => { if (MOODS[curMood] && MOODS[curMood].eye === "open") { part("eyeL").setAttribute("d", EYE.open[0]); part("eyeR").setAttribute("d", EYE.open[1]); } }, 140);
    }
    blinkTimer = setTimeout(blink, 2200 + Math.random() * 2500);
  }
  blink();
  function armSleep() {
    clearTimeout(sleepTimer);
    sleepTimer = setTimeout(() => { if (!recipe) { setMood("sleepy"); bubble.textContent = "zZ… 아, 깜빡 졸았어요. 뭐 만들까요?"; } }, 30000);
  }
  document.addEventListener("pointerdown", () => { if (curMood === "sleepy") { setMood("fail"); bubble.textContent = "앗! 깼어요! 주문하세요!"; setTimeout(() => setMood("idle"), 900); } armSleep(); }, true);
  function say(text, mood = "idle") {
    bubble.textContent = text;
    setMood(mood);
  }

  // ---------- sound (starts only after a tap) ----------
  let actx = null;
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  function getCtx() {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function beep(freq = 660, dur = 0.08, type = "sine", vol = 0.08) {
    try {
      getCtx();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // ---------- best scores (this browser only) ----------
  function loadProgress() { try { return Object.assign({ leaves: 0, diary: {}, orders: {} }, JSON.parse(localStorage.getItem("gomori-progress") || "{}")); } catch (e) { return { leaves: 0, diary: {}, orders: {} }; } }
  function saveProgress(pr) { try { localStorage.setItem("gomori-progress", JSON.stringify(pr)); } catch (e) {} }
  function loadBest() { try { return JSON.parse(localStorage.getItem("gomori-best") || "{}"); } catch (e) { return {}; } }
  function saveBest(id, score) {
    const b = loadBest();
    if (!(b[id] >= score)) { b[id] = score; try { localStorage.setItem("gomori-best", JSON.stringify(b)); } catch (e) {} }
  }

  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  // piecewise-linear map: pw(x, [[x0,y0],[x1,y1],...]) with x ascending; clamps outside the ends
  function pw(x, pts) {
    if (x <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
      if (x <= x1) return lerp(y0, y1, (x - x0) / (x1 - x0));
    }
    return pts[pts.length - 1][1];
  }
  // timing meters: pos = (sin(swing)+1)/2 hits the center whenever swing is a multiple of PI
  function timingErrMs(swing, w) {
    const m = ((swing % Math.PI) + Math.PI) % Math.PI;
    return Math.min(m, Math.PI - m) / w * 1000;
  }
  const timingScore = ms => pw(ms, [[40, 100], [120, 60], [300, 0]]);
  const TIMING_RULE = "바늘이 초록 칸 정중앙을 지나는 순간과 누른 순간의 시간 차이로 채점: ±40ms 이내 100점, 120ms 60점, ±300ms 이상 0점 (평균)";
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function mixColor(c1, c2, t) {
    const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
    const a = p(c1), b = p(c2);
    return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], t))).join(",") + ")";
  }
  function timerBar(frac) {
    rr(20, 14, W - 40, 12, 6); ctx.fillStyle = "#e3d7b8"; ctx.fill();
    const w = Math.max(0, (W - 40) * (1 - frac));
    if (w > 1) { rr(20, 14, w, 12, 6); ctx.fillStyle = frac > 0.75 ? "#ff6b4a" : "#4caf6a"; ctx.fill(); }
  }
  function label(text, x, y, size = 18, color = "#2a3326") {
    ctx.font = 'bold ' + size + 'px "Gowun Batang", serif';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = color; ctx.fillText(text, x, y);
  }
  function seeded(seed) { return () => ((seed = (seed * 9301 + 49297) % 233280) / 233280); }

  const floats = [];
  // combo & fever: good judgements stack leaves; five in a row and the wind picks up (fever)
  let combo = 0, fever = false, flash = 0, feverLeaves = [], feverTips = 0;
  const FEVER_AT = 5;
  function onJudged(text) {
    const good = /^(완벽|훌륭)/.test(text), bad = /^(아쉬|실패|빗나감)/.test(text);
    if (good) {
      combo++;
      if (/^완벽/.test(text)) { flash = 1; setMood("perfect"); }
      else setMood(combo >= 3 ? "combo" : "happy");
      if (combo >= FEVER_AT && !fever) { fever = true; music.setFever(true); say("바람이 지나가요! 피버 타임!", "combo"); }
      if (fever) { feverTips += 2; for (let i = 0; i < 6; i++) feverLeaves.push({ x: -20 - Math.random() * 60, y: 40 + Math.random() * 300, vx: 180 + Math.random() * 120, vy: (Math.random() - 0.5) * 40, r: Math.random() * 6.3, s: 0.6 + Math.random() * 0.7 }); }
    } else if (bad) {
      if (combo >= 2 || fever) setMood("sad");
      combo = 0;
      if (fever) { fever = false; music.setFever(false); }
    }
  }
  function resetCombo() { combo = 0; if (fever) { fever = false; music.setFever(false); } feverLeaves = []; }
  function pop(text, x, y, color = "#ff6b4a") {
    const stamp = /^(완벽|훌륭)/.test(text);
    // stack rapid stamps upward so they don't pile on each other
    const live = floats.filter(f => f.stamp && f.life > 0.5 && Math.abs(f.x - x) < 120).length;
    floats.push({ text, x, y: y - live * 34, life: 1, color, stamp, rot: (Math.random() - 0.5) * 0.3 });
    onJudged(text);
  }
  function drawLeaf(x, y, r, size, color) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(r); ctx.scale(size, size);
    ctx.beginPath(); ctx.moveTo(0, -10); ctx.quadraticCurveTo(9, -4, 0, 10); ctx.quadraticCurveTo(-9, -4, 0, -10); ctx.fillStyle = color; ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(0, 8); ctx.strokeStyle = "rgba(0,0,0,0.18)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
  function drawFloats(dt) {
    // fever: a gust of leaves sweeps across the stage
    for (let i = feverLeaves.length - 1; i >= 0; i--) {
      const l = feverLeaves[i];
      l.x += l.vx * dt; l.y += l.vy * dt + Math.sin(l.x / 30) * 1.2; l.r += dt * 3;
      if (l.x > W + 30) { feverLeaves.splice(i, 1); continue; }
      drawLeaf(l.x, l.y, l.r, l.s, i % 3 ? "#7fa86a" : "#f2b544");
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life -= dt * 1.1; f.y -= dt * (f.stamp ? 18 : 40);
      if (f.life <= 0) { floats.splice(i, 1); continue; }
      const age = 1 - f.life, impact = f.stamp ? 1 + Math.max(0, 0.15 - age) * 3 : 1;
      ctx.save();
      ctx.globalAlpha = clamp(f.life * 1.5, 0, 1);
      ctx.translate(f.x, f.y); ctx.rotate(f.stamp ? f.rot : 0); ctx.scale(impact, impact);
      ctx.font = 'bold ' + (f.stamp ? 26 : 30) + 'px "Gowun Batang", serif';
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      if (f.stamp) {
        const w = ctx.measureText(f.text).width + 28;
        rr(-w / 2, -22, w, 44, 10); ctx.fillStyle = "rgba(255,253,245,0.92)"; ctx.fill();
        ctx.setLineDash([]); ctx.lineWidth = 3; ctx.strokeStyle = f.color; ctx.stroke();
        rr(-w / 2 + 5, -17, w - 10, 34, 7); ctx.lineWidth = 1.2; ctx.stroke();
        ctx.fillStyle = f.color; ctx.fillText(f.text, 0, 1);
      } else {
        ctx.lineWidth = 6; ctx.strokeStyle = "#fff"; ctx.strokeText(f.text, 0, 0);
        ctx.fillStyle = f.color; ctx.fillText(f.text, 0, 0);
      }
      ctx.restore();
    }
    // combo leaves in the corner
    if (combo >= 2 && running) {
      for (let i = 0; i < Math.min(combo, 9); i++) drawLeaf(W - 22 - i * 9, 36 + (i % 2) * 4, -0.6 + i * 0.1, 0.8, fever ? "#f2b544" : "#7fa86a");
      label("콤보 " + combo + (fever ? " · 피버!" : ""), W - 30 - Math.min(combo, 9) * 9 - 52, 36, 15, fever ? "#c98f1f" : "#4f7d45");
    }
    // perfect: a pulse of lantern light at the edges
    if (flash > 0) {
      flash = Math.max(0, flash - dt * 2.5);
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.8);
      g.addColorStop(0, "rgba(242,181,68,0)"); g.addColorStop(1, "rgba(242,181,68," + (0.55 * flash) + ")");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }
  // timing meter drawn as a tree branch: a leaf slides along it, a flower marks the sweet spot
  function branchMeter(x0, x1, y, pos, showLeaf) {
    const cx = lerp(x0, x1, 0.5);
    ctx.strokeStyle = "#8a5a35"; ctx.lineWidth = 7; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x0, y + 6); ctx.quadraticCurveTo(cx, y - 4, x1, y + 6); ctx.stroke();
    ctx.lineWidth = 3; ctx.strokeStyle = "#a0714a";
    [[0.18, -1], [0.3, 1], [0.72, -1], [0.85, 1]].forEach(([f, d]) => { const bx = lerp(x0, x1, f); ctx.beginPath(); ctx.moveTo(bx, y + 2); ctx.lineTo(bx + 8 * d, y - 12 * (d > 0 ? 1 : 0.6) + (d < 0 ? 0 : 0)); ctx.stroke(); });
    const zw = (x1 - x0) * 0.2;
    rr(cx - zw / 2, y - 12, zw, 24, 10); ctx.fillStyle = "rgba(166,220,178,0.5)"; ctx.fill();
    const on = showLeaf && Math.abs(pos - 0.5) < 0.03;
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; ctx.beginPath(); ctx.ellipse(cx + Math.cos(a) * (on ? 9 : 6), y + Math.sin(a) * (on ? 9 : 6), 5, 3.2, a, 0, Math.PI * 2); ctx.fillStyle = on ? "#ff9fb0" : "#f6c1cc"; ctx.fill(); }
    ctx.beginPath(); ctx.arc(cx, y, on ? 4.5 : 3.5, 0, Math.PI * 2); ctx.fillStyle = "#f2b544"; ctx.fill();
    if (showLeaf) {
      const nx = lerp(x0, x1, pos);
      drawLeaf(nx, y - 14 + Math.abs(Math.sin(pos * 6)) * 0, Math.PI / 2 + (pos - 0.5) * 0.8, 1.35, "#4f7d45");
    }
  }
  function judge(score) {
    if (score >= 95) return ["완벽!", "#ff6b4a"];
    if (score >= 80) return ["훌륭해요", "#4caf6a"];
    if (score >= 60) return ["좋아요", "#2f8fbf"];
    if (score >= 40) return ["아쉬워요", "#d49a00"];
    return ["실패", "#7a8f89"];
  }

  // ================= minigames =================

  // ---------- chop: swipe down along dotted lines ----------
  const CHOP = {
    tomato: { name: "토마토 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 토마토를 썰어요. 점선에 가까울수록 점수가 높아요.",
      stops: [[0, "#ff7a6b"], [1, "#e8384f"]], edge: "#b52a3a", h: 66, roots: false },
    cabbage: { name: "배추 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 배추를 썰어요. 만두 속에 들어갈 거예요.",
      stops: [[0, "#f4fbe9"], [0.5, "#d2ecb0"], [1, "#8fcf6a"]], edge: "#6aa34a", h: 64, roots: false },
    onion: { name: "대파 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 대파를 썰어요. 점선에 가까울수록 점수가 높아요.",
      stops: [[0, "#f6fbf2"], [0.18, "#d9efc0"], [0.35, "#7cc46a"], [1, "#3f9a4f"]], edge: "#2f7a3e", h: 38, roots: true },
    fishcake: { name: "어묵 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 어묵을 썰어요. 점선에 가까울수록 점수가 높아요.",
      stops: [[0, "#f3d6a4"], [1, "#e4b46f"]], edge: "#b27a3c", h: 62, roots: false },
    carrot: { name: "당근 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 당근을 썰어요. 점선에 가까울수록 점수가 높아요.",
      stops: [[0, "#ffc285"], [1, "#f2832f"]], edge: "#c4621d", h: 34, roots: false },
    potato: { name: "감자 썰기", intro: "껍질 깐 감자를 점선 따라 위에서 아래로 쓱 썰어요. 길쭉하게 썰어야 감자튀김이 돼요.",
      stops: [[0, "#fbefc6"], [1, "#f1dc96"]], edge: "#c9a85a", h: 74, roots: false },
    pepper: { name: "피망 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 피망을 썰어요. 점선에 가까울수록 점수가 높아요.",
      stops: [[0, "#8fd27e"], [1, "#3f9a4f"]], edge: "#2f7a3e", h: 50, roots: false },
    banana: { name: "바나나 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 바나나를 썰어요. 점선에 가까울수록 점수가 높아요.",
      stops: [[0, "#c9a227"], [0.08, "#ffe066"], [0.92, "#ffe066"], [1, "#8a6a1a"]], edge: "#c9a227", h: 44, roots: false },
    onionWhite: { name: "양파 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 양파를 썰어요. 눈이 맵기 전에 빨리 썰어요!",
      stops: [[0, "#fbf6fb"], [1, "#eadff0"]], edge: "#b9a3c7", h: 70, roots: true },
    gimbap: { name: "김밥 썰기", intro: "다 말린 김밥을 점선 따라 위에서 아래로 쓱 썰어요. 예쁘게 썰수록 점수가 높아요.",
      stops: [[0, "#1f3324"], [1, "#2c4632"]], edge: "#0f1a12", h: 60, roots: false },
  };
  function makeChop(cfg) {
    const LINES = [150, 195, 240, 285, 330, 375];
    const LIMIT = 15;
    const MIDY = 215;
    let cut, accs, offs, misses, t, trail, start, stroke, done;
    function finishChop() {
      done = true;
      const sum = accs.reduce((a, b) => a + b, 0); // uncut lines count as 0
      const avg = offs.length ? offs.reduce((a, b) => a + b, 0) / offs.length : null;
      finish(Math.round(clamp(sum / LINES.length - misses * 4, 0, 100)),
        (avg == null ? "자른 줄 없음" : "평균 오차 " + avg.toFixed(1) + "px") + " · 빗나감 " + misses + "회" +
        (cut.every(Boolean) ? "" : " · 못 자름 " + cut.filter(c => !c).length + "줄"));
    }
    return {
      name: cfg.name, intro: cfg.intro,
      rule: "칼이 재료 가운데 높이를 지나는 위치와 점선의 거리로 채점: 3px 이내 100점, 20px에서 0점 · 세로에서 10° 넘게 기울면 감점(35°에서 ×0.8) · 빗나감 1회 −4점 · 못 자른 줄 0점",
      init() { cut = LINES.map(() => false); accs = []; offs = []; misses = 0; t = 0; trail = []; start = null; stroke = []; done = false; },
      update(dt) {
        t += dt;
        trail.forEach(p => (p.life -= dt * 3));
        trail = trail.filter(p => p.life > 0);
        if (!done && t >= LIMIT) finishChop();
      },
      down(p) { start = p; stroke = [p]; trail.push({ ...p, life: 1 }); },
      move(p) { if (start) { stroke.push(p); trail.push({ ...p, life: 1 }); } },
      up(p) {
        if (!start || done) return;
        stroke.push(p);
        const pts = stroke, s0 = start;
        start = null; stroke = [];
        // where does the stroke cross the food's middle (y = MIDY)? the stroke must span the food band there
        let crossX = null;
        for (let i = 1; i < pts.length && crossX == null; i++) {
          const a = pts[i - 1], b = pts[i];
          if ((a.y - MIDY) * (b.y - MIDY) <= 0 && a.y !== b.y) crossX = a.x + (b.x - a.x) * (MIDY - a.y) / (b.y - a.y);
        }
        const ys = pts.map(q => q.y);
        if (crossX == null) return; // never passed through the food band
        if (Math.max(...ys) - Math.min(...ys) < 20) return; // a tap, not a cut
        const ang = Math.atan2(Math.abs(p.x - s0.x), Math.abs(p.y - s0.y)) * 180 / Math.PI;
        let best = -1, bd = 1e9;
        LINES.forEach((lx, i) => { if (!cut[i] && Math.abs(lx - crossX) < bd) { bd = Math.abs(lx - crossX); best = i; } });
        if (best >= 0 && bd <= 20) {
          cut[best] = true;
          const acc = pw(bd, [[3, 100], [20, 0]]) * pw(ang, [[10, 1], [35, 0.8]]);
          accs.push(acc); offs.push(bd);
          const [txt, col] = judge(acc);
          pop(txt + " " + bd.toFixed(1) + "px", LINES[best], 150, col);
          beep(500 + acc * 4, 0.07, "triangle");
          if (cut.every(Boolean)) finishChop();
        } else {
          misses++;
          pop("빗나감", crossX, 150, "#7a8f89");
          beep(180, 0.1, "square", 0.04);
        }
      },
      draw() {
        rr(40, 110, 420, 220, 22); ctx.fillStyle = "#e2b07a"; ctx.fill();
        ctx.strokeStyle = "#c48d55"; ctx.lineWidth = 3; ctx.stroke();
        for (let i = 0; i < 5; i++) {
          ctx.beginPath(); ctx.moveTo(60, 140 + i * 40); ctx.lineTo(440, 140 + i * 40 + 6);
          ctx.strokeStyle = "rgba(196,141,85,0.35)"; ctx.lineWidth = 2; ctx.stroke();
        }
        const top = 215 - cfg.h / 2;
        const bounds = [90, ...LINES.filter((_, i) => cut[i]), 420];
        const grad = ctx.createLinearGradient(90, 0, 420, 0);
        cfg.stops.forEach(([o, c]) => grad.addColorStop(o, c));
        let shift = -((bounds.length - 2) * 6) / 2;
        for (let k = 0; k < bounds.length - 1; k++) {
          rr(bounds[k] + shift + 1, top, bounds[k + 1] - bounds[k] - 2, cfg.h, k === 0 || k === bounds.length - 2 ? 12 : 5);
          ctx.fillStyle = grad; ctx.fill();
          ctx.strokeStyle = cfg.edge; ctx.lineWidth = 2; ctx.stroke();
          shift += 6;
        }
        if (cfg.roots) {
          ctx.strokeStyle = "#cdb98a"; ctx.lineWidth = 2;
          for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(84 - (bounds.length - 2) * 3, 205 + i * 7); ctx.lineTo(70 - (bounds.length - 2) * 3, 202 + i * 9); ctx.stroke(); }
        }
        ctx.setLineDash([6, 6]); ctx.lineWidth = 3; ctx.strokeStyle = "#17423b";
        LINES.forEach((lx, i) => { if (!cut[i]) { ctx.beginPath(); ctx.moveTo(lx, top - 20); ctx.lineTo(lx, top + cfg.h + 20); ctx.stroke(); } });
        ctx.setLineDash([]);
        if (trail.length > 1) {
          ctx.lineCap = "round";
          for (let i = 1; i < trail.length; i++) {
            ctx.strokeStyle = "rgba(160,180,190," + trail[i].life + ")";
            ctx.lineWidth = 8 * trail[i].life;
            ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
          }
        }
        timerBar(t / LIMIT);
        label("남은 점선 " + cut.filter(c => !c).length + "개", 250, 360, 20);
      },
    };
  }

  // ---------- egg: tap when the needle is in the green ----------
  function makeEgg(count) {
    let idx, phase, swing, pos, anim, scores, errs, yolks;
    const slotX = i => count === 1 ? 250 : 220 + i * 60;
    return {
      name: "계란 깨기",
      intro: "바늘이 초록 칸 한가운데 올 때 화면을 톡 눌러 계란을 깨요. 계란은 " + count + "개예요.",
      rule: TIMING_RULE,
      init() { idx = 0; phase = "aim"; swing = 0; pos = 0; anim = 0; scores = []; errs = []; yolks = []; },
      update(dt) {
        if (phase === "aim") { swing += dt * (2.4 + idx * 1.1); pos = (Math.sin(swing) + 1) / 2; }
        else if (phase === "crack") {
          anim += dt;
          if (anim > 0.9) {
            yolks.push({ x: slotX(idx), y: 312 });
            idx++;
            if (idx >= count) { phase = "end"; finish(Math.round(scores.reduce((a, b) => a + b, 0) / count), "평균 오차 " + Math.round(errs.reduce((a, b) => a + b, 0) / count) + "ms"); }
            else { phase = "aim"; swing = Math.random() * 6; }
          }
        }
      },
      down() {
        if (phase !== "aim") return;
        const ms = timingErrMs(swing, 2.4 + idx * 1.1);
        const s = timingScore(ms);
        scores.push(s); errs.push(ms);
        const [txt, col] = judge(s);
        pop(txt + " " + Math.round(ms) + "ms", 250, 150, col);
        beep(s >= 70 ? 880 : 300, 0.09, "triangle");
        phase = "crack"; anim = 0;
      },
      draw() {
        ctx.fillStyle = "#cfe7f2";
        ctx.beginPath(); ctx.ellipse(250, 300, 130, 30, 0, 0, Math.PI * 2); ctx.fill();

  function makeHeat(cfg) {
    const DUR = 8, LO = 55, HI = 75, MID = 65, WARM = 1.5;
    let temp, holding, inZone, burnt, t, mTime, mClose, mIn;
    const closeness = v => pw(Math.abs(v - MID), [[3, 1], [HI - MID, 0.8], [HI - MID + 12, 0]]);

      name: cfg.name, intro: cfg.intro,
      rule: "처음 1.5초(예열)는 빼고 매 순간 채점: 65도 ±3 이내 100%, 칸 끝(55·75도)까지 80%로 줄고, 칸 밖으로 12도 벗어나면 0% · 점수 = 평균 × 100",
      init() { temp = 20; holding = false; inZone = 0; burnt = 0; t = 0; mTime = 0; mClose = 0; mIn = 0; },

        temp = clamp(temp + (holding ? 38 : -24) * dt, 0, 100);
        if (temp >= LO && temp <= HI) inZone += dt;
        if (temp > HI) burnt += dt;
        const w = Math.max(0, Math.min(t + dt, DUR) - Math.max(t, WARM));
        if (w > 0) { mTime += w; mClose += closeness(temp) * w; if (temp >= LO && temp <= HI) mIn += w; }
        t += dt;
        if (t >= DUR) {
          t = DUR;
          finish(Math.round(100 * (mTime ? mClose / mTime : 0)), "적정 온도 유지 " + Math.round(100 * (mTime ? mIn / mTime : 0)) + "%");

      up() { holding = false; },

        const ok = temp >= LO && temp <= HI;
        const now = performance.now() / 1000;

        if (cfg.vessel !== "oven") {
        rr(70, 286, 320, 70, 14); ctx.fillStyle = "#4d6e66"; ctx.fill();
        const fh = 8 + temp * 0.55;

          const fx = 120 + i * 27, h = fh * (0.8 + 0.25 * Math.sin(now * 14 + i * 1.7));
          ctx.beginPath(); ctx.moveTo(fx - 9, 288); ctx.quadraticCurveTo(fx - 6, 288 - h * 0.6, fx, 288 - h); ctx.quadraticCurveTo(fx + 6, 288 - h * 0.6, fx + 9, 288); ctx.closePath();
          ctx.fillStyle = temp > HI ? "#ff6b4a" : "#4aa3ff"; ctx.fill();
          ctx.beginPath(); ctx.moveTo(fx - 4, 288); ctx.quadraticCurveTo(fx, 288 - h * 0.5, fx + 4, 288); ctx.closePath();
          ctx.fillStyle = "#cfe9ff"; ctx.fill();

          rr(330, 90, 46, 20, 6); ctx.fillStyle = "#17423b"; ctx.fill();
          rr(90, 125, 280, 215, 16); ctx.fillStyle = mixColor("#3a4543", "#a8552c", clamp(temp / 100, 0, 1)); ctx.fill();
          ctx.strokeStyle = mixColor("#6d7d7a", "#ff6b4a", clamp(temp / 100, 0, 1)); ctx.lineWidth = 4;
          ctx.beginPath(); for (let i = 0; i <= 10; i++) ctx.lineTo(110 + i * 24, i % 2 ? 315 : 305); ctx.stroke();
          ctx.fillStyle = "#9fb3ae"; ctx.fillRect(100, 280, 260, 5);
          if (cfg.food === "pizza") {
            ctx.beginPath(); ctx.ellipse(230, 262, 110, 26, 0, 0, Math.PI * 2); ctx.fillStyle = mixColor("#f3d9a4", "#d9963f", cook); ctx.fill();

            for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(170 + i * 24, 256 + (i % 2) * 8, 10, 4, 0, 0, Math.PI * 2); ctx.fillStyle = "#c8402c"; ctx.fill(); }

    };

  const POUR = {

    const LIMIT = 12, RATE = 0.3;
    const CX0 = 175, CX1 = 325, CY0 = 130, CY1 = 340;
    let level, stream, holding, idle, t, done, poured;
    function evaluate() {
      done = true;
      const c = (cfg.lo + cfg.hi) / 2, h = (cfg.hi - cfg.lo) / 2 * 100, e = (level - c) * 100, d = Math.abs(e);
      const s = level >= 1 ? 0 : Math.round(pw(d, [[1, 100], [h, 70], [h + 12, 0]]));
      const [txt, col] = judge(s);
      pop(txt, 250, CY1 - level * (CY1 - CY0) - 30, col);
      finish(s, level >= 1 ? "넘쳤어요 (목표보다 +" + (100 - c * 100).toFixed(1) + "%)" : "목표보다 " + (e >= 0 ? "+" : "-") + d.toFixed(1) + "%");
    }

      rule: "멈춘 높이와 초록 칸 한가운데의 차이(컵 높이의 %)로 채점: 1% 이내 100점, 칸 끝(±" + HALF + "%)에서 70점, 거기서 12% 더 벗어나면 0점 · 넘치면 0점",
      init() { level = 0; stream = 0; holding = false; idle = 0; t = 0; done = false; poured = false; },
      update(dt) {

        stream = holding ? Math.min(1, stream + dt * 5) : Math.max(0, stream - dt * 3);

        if (stream > 0) poured = true;
        idle = poured && !holding && stream === 0 ? idle + dt : 0;
        if (level >= 1) { level = 1; evaluate(); }
        else if (idle > 0.8 || t >= LIMIT) evaluate();

        ctx.setLineDash([8, 6]); ctx.strokeStyle = "#4caf6a"; ctx.lineWidth = 3;

        ctx.setLineDash([]);
        label("여기까지", CX1 + 60, (y0 + y1) / 2, 18, "#2f7a3e");

      intro: "팬 안에서 빙글빙글 다섯 바퀴 볶아서 밥을 케첩 색으로 물들여요." },

  function makeStir(cfg) {
    const CX = 250, CY = 210, R = 150, NEED = cfg.need, LIMIT = 14;
    let bits, total, posA, negA, goodPos, goodNeg, prevA, t, ptr, done;
    const control = () => total > 0 ? (posA >= negA ? goodPos : goodNeg) / total : 0;
    function finishStir(timeout) {
      done = true;
      const prog = clamp(total / (NEED * Math.PI * 2), 0, 1);
      const speed = timeout ? prog * 30 : pw(t, [[5, 100], [LIMIT, 30]]);
      const c = control();
      finish(Math.round(clamp(0.7 * speed + 0.3 * c * 100, 0, 100)),
        (timeout ? "시간 초과 " + Math.floor(total / (Math.PI * 2)) + "/" + NEED + "바퀴" : t.toFixed(1) + "초") + " · 안정감 " + Math.round(c * 100) + "%");
    }
    return {
      name: cfg.name, intro: cfg.intro,
      rule: "속도 70% + 안정감 30%: 5초 안에 다 저으면 속도 100점, 14초면 30점 · 안정감 = 한 방향으로, 그릇 안쪽(가장자리·한가운데 제외)에서 저은 비율",
      init() {
        bits = [];
        cfg.bits.forEach(([n, kind]) => { for (let i = 0; i < n; i++) bits.push({ r: Math.sqrt(Math.random()) * 118, a: Math.random() * Math.PI * 2, rot: Math.random() * 3, kind }); });
        bits.sort(() => Math.random() - 0.5);
        total = 0; posA = 0; negA = 0; goodPos = 0; goodNeg = 0; prevA = null; t = 0; ptr = null; done = false;
      },
      update(dt) {
        if (done) return;
        t += dt;
        if (t >= LIMIT) finishStir(true);
      },
      down(p) { ptr = p; prevA = null; this.move(p); },
      move(p) {
        if (!ptr || done) return;
        ptr = p;
        const dx = p.x - CX, dy = p.y - CY, dist = Math.hypot(dx, dy);
        if (dist > R + 50 || dist < 15) { prevA = null; return; }
        const a = Math.atan2(dy, dx);
        if (prevA !== null) {
          let d = a - prevA;
          if (d > Math.PI) d -= Math.PI * 2;
          if (d < -Math.PI) d += Math.PI * 2;
          const before = Math.floor(total / (Math.PI * 2));
          total += Math.abs(d);
          const inRing = dist >= 35 && dist <= R - 5;
          if (d >= 0) { posA += d; if (inRing) goodPos += d; } else { negA -= d; if (inRing) goodNeg -= d; }
          bits.forEach(b => { b.a += d * (0.35 + 0.5 * b.r / 118); });
          const after = Math.floor(total / (Math.PI * 2));
          if (after > before && after <= NEED) { pop(after + "바퀴!", CX, CY - 40, "#d49a00"); beep(520 + after * 80, 0.08, "triangle"); }
          if (total >= NEED * Math.PI * 2) { finishStir(false); return; }
        }
        prevA = a;
      },
      up() { ptr = null; prevA = null; },
      draw() {
        const prog = clamp(total / (NEED * Math.PI * 2), 0, 1);
        if (cfg.vessel === "bowl") {
          ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.fillStyle = "#8cc6dd"; ctx.fill();
        } else if (cfg.vessel === "pot") {
          ctx.fillStyle = "#8fa3a0"; rr(CX - R - 30, CY - 12, 40, 24, 8); ctx.fill(); rr(CX + R - 10, CY - 12, 40, 24, 8); ctx.fill();
          ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.fillStyle = "#b9c9c6"; ctx.fill();
        } else {
          ctx.fillStyle = "#2d3a37";
          ctx.save(); ctx.translate(CX, CY); ctx.rotate(0.6); rr(R - 12, -11, 130, 22, 10); ctx.fill(); ctx.restore();
          ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.fill();
        }
        ctx.beginPath(); ctx.arc(CX, CY, R - 14, 0, Math.PI * 2); ctx.fillStyle = mixColor(cfg.inner[0], cfg.inner[1], prog); ctx.fill();
        bits.forEach(b => {
          const k = KINDS[b.kind];
          const x = CX + Math.cos(b.a) * b.r, y = CY + Math.sin(b.a) * b.r;
          ctx.save(); ctx.translate(x, y); ctx.rotate(b.rot + b.a);
          ctx.fillStyle = mixColor(k.c0, k.c1, prog);
          if (b.kind === "rice") { ctx.beginPath(); ctx.ellipse(0, 0, 5, 2.6, 0, 0, Math.PI * 2); ctx.fill(); }
          else if (b.kind === "egg") { rr(-6, -4, 12, 8, 3); ctx.fill(); }
          else if (b.kind === "onion") { ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fillStyle = "#c7ecb5"; ctx.fill(); }
          else if (b.kind === "tteok") { rr(-14, -6, 28, 12, 6); ctx.fill(); ctx.strokeStyle = "rgba(0,0,0,0.12)"; ctx.lineWidth = 1.5; ctx.stroke(); }
          else if (b.kind === "fishcake") { ctx.beginPath(); ctx.moveTo(-10, 6); ctx.lineTo(10, 6); ctx.lineTo(0, -9); ctx.closePath(); ctx.fill(); }
          else if (b.kind === "noodle") { ctx.beginPath(); for (let i = 0; i <= 8; i++) ctx.lineTo(-16 + i * 4, Math.sin(i * 1.6) * 3); ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.stroke(); }
          else if (b.kind === "ham") { rr(-5, -5, 10, 10, 2); ctx.fill(); }
          else if (b.kind === "ketchupRice") { ctx.beginPath(); ctx.ellipse(0, 0, 5, 2.6, 0, 0, Math.PI * 2); ctx.fill(); }
          else if (b.kind === "bananaSlice") { ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "#e9cf6a"; ctx.lineWidth = 1.5; ctx.stroke(); }
          else if (b.kind === "berry") { drawItem("strawberry", 0, 0, 0.7); }
          else if (b.kind === "kiwi") { ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fillStyle = "#eef7d8"; ctx.fill(); ctx.fillStyle = "#1d2420"; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(Math.cos(i) * 5.5, Math.sin(i) * 5.5, 0.9, 0, Math.PI * 2); ctx.fill(); } }
          else if (b.kind === "seaweedFlake") { rr(-3, -3, 6, 6, 1); ctx.fill(); }
          else if (b.kind === "meat") { ctx.beginPath(); ctx.ellipse(0, 0, 6, 4, 0, 0, Math.PI * 2); ctx.fill(); }
          else if (b.kind === "cabbageBit") { rr(-6, -3, 12, 6, 2); ctx.fill(); }
          else if (b.kind === "tofu") { rr(-5, -5, 10, 10, 1); ctx.fill(); ctx.strokeStyle = "#e5e0cf"; ctx.lineWidth = 1; ctx.stroke(); }
          else if (b.kind === "potatoCube" || b.kind === "carrotCube") { rr(-7, -7, 14, 14, 3); ctx.fill(); }
          else if (b.kind === "lump") { const r = 6 * (1 - prog) + 0.5; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); }
          ctx.restore();
        });
        if (!ptr && total === 0) {
          ctx.setLineDash([8, 8]); ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(CX, CY, 80, 0, Math.PI * 1.7); ctx.stroke(); ctx.setLineDash([]);
          const ex = CX + Math.cos(Math.PI * 1.7) * 80, ey = CY + Math.sin(Math.PI * 1.7) * 80;
          ctx.beginPath(); ctx.moveTo(ex + 12, ey + 2); ctx.lineTo(ex - 4, ey - 10); ctx.lineTo(ex - 6, ey + 10); ctx.closePath(); ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.fill();
        }
        if (ptr) {
          const dx = ptr.x - CX, dy = ptr.y - CY;
          ctx.save(); ctx.translate(ptr.x, ptr.y); ctx.rotate(Math.atan2(dy, dx) + Math.PI / 2);
          if (cfg.vessel === "bowl") {
            ctx.strokeStyle = "#9aa8a6"; ctx.lineWidth = 3;
            for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.ellipse(0, 0, 8 + Math.abs(i) * 6, 16, 0, 0, Math.PI * 2); ctx.stroke(); }
            ctx.fillStyle = "#6d7d7a"; ctx.fillRect(-3, 14, 6, 70);
          } else {
            rr(-16, -14, 32, 28, 6); ctx.fillStyle = "#e9a15a"; ctx.fill();
            ctx.fillStyle = "#b8743a"; ctx.fillRect(-4, 12, 8, 70);
          }
          ctx.restore();
        }
        timerBar(t / LIMIT);
        label(Math.min(NEED, Math.floor(total / (Math.PI * 2))) + " / " + NEED + " 바퀴", 250, 385, 20);
      },
    };
  }

  // ---------- shared item shapes (toppings, fruit) ----------
  const STRIP = { carrot: "#f2832f", spinach: "#3f8f3a", eggStrip: "#ffcc4d", danmuji: "#ffe14d" };
  function drawItem(kind, x, y, scale = 1) {

  function makeSqueeze(cfg) {
    const LIMIT = 8;
    let taps, times, t, pulse, done;
    function finishSqueeze(timeout) {
      done = true;
      const iv = times.slice(1).map((x, i) => x - times[i]);
      const span = times.length > 1 ? times[times.length - 1] - times[0] : 0;
      const rate = span > 0 ? iv.length / span : 0;
      const mean = iv.length ? iv.reduce((a, b) => a + b, 0) / iv.length : 0;
      const cv = iv.length > 1 && mean > 0 ? Math.sqrt(iv.reduce((a, b) => a + (b - mean) ** 2, 0) / iv.length) / mean : 0;
      const score = timeout ? taps / cfg.need * 30 : pw(rate, [[2, 30], [6, 100]]) * pw(cv, [[0.25, 1], [0.6, 0.85]]);
      finish(Math.round(clamp(score, 0, 100)),
        (timeout ? "시간 초과 " + taps + "/" + cfg.need + "번 · " : "") + "초당 " + rate.toFixed(1) + "회 · 리듬 " + Math.round(clamp(1 - cv, 0, 1) * 100) + "%");
    }
    return {
      name: cfg.name, intro: cfg.intro,
      rule: "누르는 빠르기(첫 탭부터 마지막 탭까지)로 채점: 초당 6회 이상 100점, 초당 2회 30점 · 탭 간격이 들쭉날쭉하면(변동계수 0.25 초과) 최대 ×0.85",
      init() { taps = 0; times = []; t = 0; pulse = 0; done = false; },
      update(dt) {
        t += dt; pulse = Math.max(0, pulse - dt * 6);
        if (!done && t >= LIMIT) finishSqueeze(true);
      },
      down() {
        if (done) return;
        taps++; pulse = 1; times.push(performance.now() / 1000);
        beep(380 + taps * 25, 0.05, "triangle", 0.05);
        if (taps % 3 === 0 && taps < cfg.need) pop(["꾹!", "꼭꼭!", "조물조물!"][(taps / 3) % 3], 250, 90, "#d49a00");
        if (taps >= cfg.need) finishSqueeze(false);
      },
      draw() {
        rr(60, 120, 380, 230, 24); ctx.fillStyle = "#e2b07a"; ctx.fill();
        const prog = clamp(taps / cfg.need, 0, 1);
        // shapeless lump fading into the finished shape
        ctx.globalAlpha = 1 - prog;
        const lump = cfg.food === "riceball" ? "#fbfaf3" : cfg.food === "dumpling" ? "#fbf6ea" : cfg.food === "patty" ? "#d48c7e" : cfg.food === "cookie" ? "#e9c27a" : "#f3dca6";
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) { const a = i / 12 * Math.PI * 2, r = 70 + Math.sin(i * 2.3) * 14; ctx.lineTo(250 + Math.cos(a) * r, 235 + Math.sin(a) * r * 0.8); }
        ctx.closePath(); ctx.fillStyle = lump; ctx.fill();
        ctx.globalAlpha = prog;
        drawShaped(cfg.food, 250, 235, 0.9 - pulse * 0.08);
        ctx.globalAlpha = 1;
        // hands
        const gap = 160 - pulse * 40;
        [-1, 1].forEach(sgn => {
          ctx.save(); ctx.translate(250 + sgn * gap, 235); ctx.scale(sgn, 1);
          rr(-10, -45, 60, 90, 28); ctx.fillStyle = "#ffd9a8"; ctx.fill(); ctx.strokeStyle = "#17423b"; ctx.lineWidth = 3; ctx.stroke();
          ctx.restore();
        });
        rr(150, 360, 200, 14, 7); ctx.fillStyle = "#e3eee9"; ctx.fill();
        if (prog > 0) { rr(150, 360, 200 * prog, 14, 7); ctx.fillStyle = "#ffcc4d"; ctx.fill(); }
        timerBar(t / LIMIT);
        label(taps + " / " + cfg.need, 250, 335, 20, "#ffffff");
      },
    };
  }

    ["전체", ...LEVELS].forEach((l, i) => on("lv-" + i, () => { menuFilter = l; menu(); }));
  }

  function startRecipe(r) {
    recipe = r; steps = r.steps(); results = []; details = []; cur = -1;
    recipeEl.textContent = "오늘의 요리 · " + r.name;
    resetCombo(); feverTips = 0;
    intro(0);
  }

  function intro(i) {
    cur = i; scene = steps[i]; scene.init(); running = false; renderSteps();
    say(scene.intro, "explain");
    show('<div class="card"><div class="eyebrow">' + recipe.name + " · " + (i + 1) + "단계</div><h2>" + scene.name + "</h2><p>" + scene.intro +
      '</p><p class="rule">채점 기준 · ' + scene.rule + '</p><button id="btn-go" type="button">시작!</button></div>');
    on("btn-go", () => { hide(); running = true; setMood("focus"); });
  }

  function finish(score, detail = "") {
    if (!running) return;
    running = false;
    results[cur] = score;
    details[cur] = detail;
    renderSteps();
    const [txt] = judge(score);
    const line = score >= 95 ? "완벽해요! 지원이도 깜짝 놀랐어요." :
                 score >= 80 ? "아주 잘했어요! 이 정도면 셰프예요." :
                 score >= 60 ? "좋아요! 조금만 더 다듬으면 완벽해요." :
                 score >= 40 ? "괜찮아요, 조금만 더 연습해 봐요." :
                               "걱정 마세요, 지원이가 살짝 도와줄게요!";
    say(line, score >= 95 ? "perfect" : score >= 60 ? "happy" : score >= 40 ? "sad" : "fail");
    if (score < 60) resetCombo();
    setTimeout(() => {
      const last = cur === steps.length - 1;
      show('<div class="card"><div class="eyebrow">' + scene.name + '</div><div class="big">' + score + '<small style="font-size:1.2rem">점</small></div><h2>' + txt +
        '</h2>' + (detail ? '<p id="step-detail" class="detail">' + detail + '</p>' : "") + '<button id="btn-next" type="button">' + (last ? "완성 접시 보기" : "다음 단계") + "</button></div>");
      on("btn-next", () => { last ? result() : intro(cur + 1); });
    }, 700);
  }

  function result() {
    const id = recipe.id;
    scene = { draw() { DISHES[id](); } }; running = false; cur = steps.length; renderSteps();
    const total = Math.round(results.reduce((a, b) => a + b, 0) / steps.length);
    const prevBest = loadBest()[id];
    saveBest(id, total);
    const medal = total >= 90 ? ["금", "#ffcc4d", "금메달 셰프! 정말 맛있겠어요."] :
                  total >= 75 ? ["은", "#d6e0dd", "은메달! 다음엔 금메달도 가능해요."] :
                  total >= 55 ? ["동", "#e0a77a", "동메달! 맛있는 " + recipe.name + " 완성!"] :
                                ["참가", "#ffffff", "끝까지 완성했어요! 한 번 더 해 볼까요?"];
    const record = prevBest == null || total > prevBest;
    const grade = total >= 95 ? "S" : total >= 85 ? "A" : total >= 70 ? "B" : total >= 50 ? "C" : "D";
    // rewards: first completion opens a diary page, guest orders pay leaf tips, the daily special pays double
    const pr = loadProgress();
    const first = !pr.diary[id];
    const cleared = RECIPES.filter(r => !r.hidden && (loadBest()[r.id] != null)).length;
    let tips = 0, notes = [];
    if (total >= 55) {
      tips += total >= 90 ? 6 : 3;
      activeGuests(cleared - (first ? 1 : 0)).forEach(g => {
        if (guestOrder(g) === id && !pr.orders[dayKey() + g.id]) { pr.orders[dayKey() + g.id] = true; tips += 10; notes.push(g.name + ": \"" + g.lines[hashStr(dayKey() + id) % g.lines.length] + "\" · 나뭇잎 +10"); }
      });
      if (id === specialId()) { tips *= 2; notes.push("오늘의 특선! 나뭇잎 2배"); }
    }
    if (feverTips) { tips += feverTips; notes.push("피버 타임 보너스 · 나뭇잎 +" + feverTips); }
    if (first) pr.diary[id] = true;
    pr.leaves += tips; saveProgress(pr); renderLeaves(pr.leaves);
    const unlockedDecor = DECOR.find(d => d.at === cleared && first);
    const nowOpen = first && secretOpen(loadBest());
    const dallaeHere = activeGuests(cleared).some(g => g.id === "dallae");
    const dallaeLine = dallaeHere && details[0] ? '달래: "' + details[0] + '… 괜찮군."' : "";
    say(medal[2] + (record ? " 최고 기록이에요!" : ""), total >= 90 ? "touched" : total >= 55 ? "present" : "idle");
    resetCombo();
    show('<div class="card"><div class="eyebrow">완성 · ' + recipe.name + '</div><div class="medal" style="background:' + medal[1] + '">' + medal[0] +
      '</div><div class="big">' + total + '<small style="font-size:1.2rem">점 · <span id="grade" class="grade">' + grade + '</span></small></div><ul class="scores">' +
      steps.map((s, i) => "<li><span>" + s.name + (details[i] ? '<small>' + details[i] + "</small>" : "") +
        "</span><b>" + results[i] + "</b></li>").join("") +
      '</ul>' + (tips ? '<div class="tip">나뭇잎 +' + tips + (notes.length ? " · " + notes.join(" · ") : "") + "</div>" : "") +
      (dallaeLine ? '<p class="detail">' + dallaeLine + "</p>" : "") +
      (first ? '<div class="note"><small>레시피 노트에 추가 · 지원이의 일기</small>' + (DIARY[id] || "") + "</div>" : "") +
      (unlockedDecor ? '<div class="tip">부엌 꾸미기 해금: ' + unlockedDecor.name + "</div>" : "") +
      (nowOpen ? '<div class="tip">모든 요리 S등급! 비밀 레시피가 열렸어요.</div>' : "") +
      '<div class="btn-row"><button id="btn-again" type="button" class="ghost">다시 하기</button><button id="btn-menu" type="button">다른 요리</button></div></div>');
    on("btn-again", () => startRecipe(recipe));
    on("btn-menu", menu);
  }

  // ================= input =================
  function pt(e) {
    const r = cv.getBoundingClientRect();
    return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
  }
  cv.addEventListener("pointerdown", e => {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    if (running && scene.down) scene.down(pt(e));
  });
  cv.addEventListener("pointermove", e => { if (running && scene.move) scene.move(pt(e)); });
  const end = e => { if (running && scene.up) scene.up(pt(e)); };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);
  document.addEventListener("gesturestart", e => e.preventDefault());

  // ================= render loop =================
  function resize() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
  }
  window.addEventListener("resize", resize);
  resize();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    ctx = mainCtx;
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    ctx.fillStyle = "#f1ead6"; ctx.fillRect(0, 0, W, H);
    const s = scene || kitchen;
    if (running && s.update) s.update(dt);
    s.draw();
    drawFloats(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- background music, played live with Web Audio ----------
  // two original tracks: "forest" (quiet piano + flute walk through the woods) and "jazz" (breezy swing)
  const music = (() => {
    const MODES = ["forest", "jazz", "off"];
    let mode = "forest";
    try { const v = localStorage.getItem("gomori-music"); if (MODES.includes(v)) mode = v; } catch (e) {}
    let playing = false, timer = null, master = null, noiseBuf = null, windGain = null, windFilter = null;
    let nextTime = 0, eighth = 0, bar = 0, melodyNote = 76;
    const BPM = 86, BEAT = 60 / BPM, SWING = 0.66;
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    // ii-V-I in C with a turnaround: Dm9 G13 Cmaj9 Am9 Fmaj9 Em7 Dm9 G9sus
    const CHORDS = [
      { root: 50, v: [53, 57, 60, 64] }, { root: 43, v: [53, 59, 64] },
      { root: 48, v: [52, 55, 59, 62] }, { root: 45, v: [55, 60, 64, 71] },
      { root: 41, v: [52, 57, 60, 67] }, { root: 40, v: [50, 55, 59, 64] },
      { root: 50, v: [53, 57, 60, 64] }, { root: 43, v: [53, 57, 60, 62] },
    ];
    const PENTA = [72, 74, 76, 79, 81, 84, 86];

    // forest track: 3/4 at 72 BPM, A minor, 16-bar loop (melody written for this game)
    const F_BEAT = 60 / 72;
    const F_CHORDS = {
      Am: [45, [57, 64, 69, 72, 69, 64]], F: [41, [53, 60, 65, 69, 65, 60]], C: [48, [55, 60, 64, 67, 64, 60]],
      G: [43, [55, 62, 67, 71, 67, 62]], Dm: [50, [57, 62, 65, 69, 65, 62]], E: [40, [56, 59, 64, 68, 64, 59]],
      Em: [40, [55, 59, 64, 67, 64, 59]], Cmaj7: [48, [55, 59, 64, 67, 64, 59]],
    };
    const F_PROG = ["Am", "F", "C", "G", "Am", "Dm", "E", "Am", "F", "G", "Em", "Am", "Dm", "G", "Cmaj7", "E"];
    const F_MELODY = [
      [[76, 2], [74, 1]], [[72, 2], [69, 1]], [[67, 1.5], [69, 0.5], [72, 1]], [[71, 3]],
      [[72, 1], [74, 1], [76, 1]], [[77, 2], [76, 1]], [[74, 1], [72, 1], [71, 1]], [[69, 3]],
      [[81, 2], [79, 1]], [[77, 2], [76, 1]], [[74, 1.5], [76, 0.5], [79, 1]], [[76, 3]],
      [[74, 1], [77, 1], [81, 1]], [[79, 2], [77, 1]], [[76, 1], [74, 1], [72, 1]], [[71, 2], [68, 1]],
    ];
    let feverUp = 0;
    const F_NOTES = {};
    F_MELODY.forEach((bar, b) => { let pos = 0; bar.forEach(([m, d]) => { F_NOTES[b * 6 + pos * 2] = [m, d]; pos += d; }); });

    function env(g, t, peak, attack, decay) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    }
    function epiano(m, t, vel, decay = 1.9, cutoff = 2200) {
      const c = actx, g = c.createGain(), f = c.createBiquadFilter();
      f.type = "lowpass"; f.frequency.value = cutoff;
      [[1, 1], [2, 0.18], [3.01, 0.05]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), og = c.createGain();
        o.type = "sine"; o.frequency.value = mtof(m) * mul; og.gain.value = amp;
        o.connect(og).connect(f); o.start(t); o.stop(t + decay + 0.3);
      });
      f.connect(g).connect(master);
      env(g, t, vel, 0.015, decay);
    }
    function flute(m, t, dur) {
      const c = actx, o = c.createOscillator(), o2 = c.createOscillator(), g2 = c.createGain(), g = c.createGain();
      const vib = c.createOscillator(), vg = c.createGain(), f = c.createBiquadFilter();
      o.type = "sine"; o.frequency.value = mtof(m);
      o2.type = "triangle"; o2.frequency.value = mtof(m) * 2; g2.gain.value = 0.07;
      vib.frequency.value = 5; vg.gain.setValueAtTime(0, t); vg.gain.linearRampToValueAtTime(mtof(m) * 0.007, t + Math.min(0.5, dur * 0.6));
      vib.connect(vg); vg.connect(o.frequency);
      f.type = "lowpass"; f.frequency.value = 3000;
      o.connect(g); o2.connect(g2).connect(g); g.connect(f).connect(master);
      const end = t + Math.max(0.2, dur - 0.08);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.085, t + 0.09);
      g.gain.setValueAtTime(0.075, end);
      g.gain.exponentialRampToValueAtTime(0.0001, end + 0.35);
      [o, o2, vib].forEach(x => { x.start(t); x.stop(end + 0.4); });
    }
    function pad(notes, t, dur) {
      const c = actx, f = c.createBiquadFilter(), g = c.createGain();
      f.type = "lowpass"; f.frequency.value = 850;
      notes.forEach(m => [-6, 6].forEach(cents => {
        const o = c.createOscillator(); o.type = "sawtooth"; o.frequency.value = mtof(m); o.detune.value = cents;
        o.connect(f); o.start(t); o.stop(t + dur + 1.2);
      }));
      f.connect(g).connect(master);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.012, t + dur * 0.4);
      g.gain.linearRampToValueAtTime(0.0001, t + dur + 1.1);
    }
    function bass(m, t) {
      const c = actx, o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
      o.type = "triangle"; o.frequency.value = mtof(m);
      f.type = "lowpass"; f.frequency.value = 700;
      o.connect(f).connect(g).connect(master);
      env(g, t, 0.22, 0.01, BEAT * 0.95);
      o.start(t); o.stop(t + BEAT + 0.1);
    }
    function vibes(m, t) {
      const c = actx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), trem = c.createOscillator(), tg = c.createGain(), out = c.createGain();
      o.type = "sine"; o.frequency.value = mtof(m);
      o2.type = "sine"; o2.frequency.value = mtof(m) * 4; const g2 = c.createGain(); g2.gain.value = 0.06;
      trem.frequency.value = 5.2; tg.gain.value = 0.35; out.gain.value = 0.65;
      trem.connect(tg).connect(out.gain);
      o.connect(g); o2.connect(g2).connect(g);
      g.connect(out).connect(master);
      env(g, t, 0.075, 0.008, 1.6);
      [o, o2, trem].forEach(x => { x.start(t); x.stop(t + 1.8); });
    }
    function noise(t, dur, freq, q, peak, type = "bandpass") {
      const c = actx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
      s.connect(f).connect(g).connect(master);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + dur * 0.4);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.start(t, Math.random()); s.stop(t + dur + 0.05);
    }
    function startWind() {
      const c = actx, s = c.createBufferSource();
      s.buffer = noiseBuf; s.loop = true;
      windFilter = c.createBiquadFilter(); windFilter.type = "bandpass"; windFilter.frequency.value = 600; windFilter.Q.value = 0.8;
      windGain = c.createGain(); windGain.gain.value = 0.02;
      const lfo = c.createOscillator(), lg = c.createGain();
      lfo.frequency.value = 0.07; lg.gain.value = 350;
      lfo.connect(lg).connect(windFilter.frequency);
      s.connect(windFilter).connect(windGain).connect(master);
      s.start(); lfo.start();
    }
    function gust(t) {
      // a breeze passing through: swell up, sweep the filter, fade away
      windGain.gain.setTargetAtTime(0.07, t, 1.2);
      windGain.gain.setTargetAtTime(0.02, t + 3.5, 1.8);
      windFilter.Q.setTargetAtTime(2.2, t, 1.5);
      windFilter.Q.setTargetAtTime(0.8, t + 4, 2);
    }
    function scheduleEighth(t) {
      const ch = CHORDS[bar % CHORDS.length], nx = CHORDS[(bar + 1) % CHORDS.length];
      const beat = eighth >> 1, off = eighth & 1;
      if (!off) {
        const walk = [ch.root, ch.root + 7, ch.root + 5, nx.root + (Math.random() < 0.5 ? 1 : -1)];
        bass(walk[beat], t);
      }
      if (eighth === 0) ch.v.forEach((m, i) => epiano(m, t + i * 0.012, 0.045));
      if (eighth === 3 && Math.random() < 0.7) ch.v.forEach(m => epiano(m, t, 0.028));
      if (eighth === 2 || eighth === 6) noise(t, 0.22, 2800, 0.7, 0.035);
      noise(t, 0.06, 7000, 1, off ? 0.012 : 0.007, "highpass");
      if (Math.random() < (off ? 0.18 : 0.26)) {
        let i = PENTA.indexOf(melodyNote);
        i = clamp(i + [-2, -1, -1, 1, 1, 2][Math.floor(Math.random() * 6)], 0, PENTA.length - 1);
        melodyNote = PENTA[i];
        vibes(melodyNote + feverUp, t);
      }
      if (eighth === 0 && bar % 4 === 2) gust(t);
    }
    function scheduleForest(t) {
      const name = F_PROG[bar % 16], [root, arp] = F_CHORDS[name];
      if (eighth === 0) {
        epiano(root, t, 0.07, 2.8, 1400);
        pad(arp.slice(0, 4).map(m => m + 12), t, F_BEAT * 3);
        if (bar % 8 === 4) gust(t);
      }
      epiano(arp[eighth], t + 0.004, eighth === 0 ? 0.04 : 0.028, 1.6, 1800);
      const mel = F_NOTES[(bar % 16) * 6 + eighth];
      if (mel && bar >= 2) flute(mel[0] + feverUp, t, mel[1] * F_BEAT);
    }
    function tick() {
      if (mode === "forest") {
        while (nextTime < actx.currentTime + 0.25) {
          scheduleForest(nextTime);
          nextTime += F_BEAT / 2;
          eighth++;
          if (eighth === 6) { eighth = 0; bar++; }
        }
        return;
      }
      while (nextTime < actx.currentTime + 0.25) {
        scheduleEighth(nextTime);
        const beatStart = nextTime - ((eighth & 1) ? BEAT * SWING : 0);
        if (eighth & 1) nextTime = beatStart + BEAT;
        else nextTime += BEAT * SWING;
        eighth++;
        if (eighth === 8) { eighth = 0; bar++; }
      }
    }
    function start() {
      if (playing || mode === "off") return;
      getCtx();
      if (!noiseBuf) {
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (!master) {
        const comp = actx.createDynamicsCompressor();
        master = actx.createGain(); master.gain.value = 0.0001;
        master.connect(comp).connect(actx.destination);
        startWind();
      }
      master.gain.cancelScheduledValues(actx.currentTime);
      master.gain.setTargetAtTime(0.55, actx.currentTime, 0.8);
      nextTime = actx.currentTime + 0.1; eighth = 0; bar = 0;
      timer = setInterval(tick, 60);
      playing = true;
    }
    function stop() {
      if (!playing) return;
      clearInterval(timer); timer = null; playing = false;
      master.gain.cancelScheduledValues(actx.currentTime);
      master.gain.setTargetAtTime(0.0001, actx.currentTime, 0.3);
    }
    function next() {
      mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
      try { localStorage.setItem("gomori-music", mode); } catch (e) {}
      stop();
      if (mode !== "off") start();
    }
    document.addEventListener("visibilitychange", () => {
      if (!actx) return;
      if (document.hidden) actx.suspend(); else actx.resume();
    });
    return { start, stop, next, mode: () => mode, setFever: v => { feverUp = v ? 12 : 0; } };
  })();

  const musicBtn = document.getElementById("btn-music");
  function renderMusicBtn() {
    const m = music.mode();
    musicBtn.textContent = { forest: "♪ 숲길", jazz: "♪ 재즈", off: "♪ 음악 끔" }[m];
    musicBtn.setAttribute("aria-label", "배경음악 바꾸기, 지금: " + musicBtn.textContent.slice(2));
    musicBtn.classList.toggle("on", m !== "off");
  }
  musicBtn.addEventListener("click", () => { music.next(); renderMusicBtn(); });
  renderMusicBtn();
  // browsers only allow sound after the first touch, so start the music then
  function firstGesture(e) {
    if (e.target === musicBtn) return;
    ["pointerdown", "touchend", "click"].forEach(t => document.removeEventListener(t, firstGesture, true));
    music.start();
  }
  ["pointerdown", "touchend", "click"].forEach(t => document.addEventListener(t, firstGesture, true));

  (function timeOfDay() {
    const h = new Date().getHours(), root = document.documentElement.style;
    if (h >= 19 || h < 6) { root.setProperty("--moss", "#1b2d23"); root.setProperty("--moss-2", "#27402f"); root.setProperty("--paper", "#ece2c8"); }
    else if (h < 11) { root.setProperty("--paper", "#f6f0de"); root.setProperty("--moss", "#2a4233"); }
  })();
  menu();
})();
</script>
