<title>지원 키친</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* Layout: one-screen game. Top bar (recipe + step dots), square-ish canvas stage with overlay cards, host character row at the bottom.
     Single committed look: mint-tile kitchen, wood board, tomato buttons. */
  :root {
    --tile: #dcefe7;
    --tile-line: #c6e2d7;
    --ink: #17423b;
    --ink-soft: #4d6e66;
    --card: #ffffff;
    --tomato: #ff6b4a;
    --tomato-dark: #d84e30;
    --butter: #ffcc4d;
    --leaf: #4caf6a;
    --font-display: "Jua", "Apple SD Gothic Neo", system-ui, sans-serif;
    --font-body: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background-color: var(--tile);
    background-image:
      linear-gradient(var(--tile-line) 2px, transparent 2px),
      linear-gradient(90deg, var(--tile-line) 2px, transparent 2px);
    background-size: 48px 48px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    overflow: hidden;
  }
  .app {
    height: 100%;
    max-width: 760px; margin: 0 auto;
    padding: 0 16px; padding-block: 12px;
    display: grid; grid-template-rows: auto 1fr auto; gap: 12px;
    box-sizing: border-box;
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { font-family: var(--font-display); font-size: 1.6rem; line-height: 1; }
  .recipe { color: var(--ink-soft); font-size: 0.95rem; }
  .top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .music-btn { font-size: 0.9rem; padding: 6px 12px; border-radius: 999px; color: var(--ink-soft); background: var(--card); border: 2px solid var(--tile-line); box-shadow: none; }
  .music-btn.on { color: var(--ink); border-color: var(--ink); }
  .music-btn:active { transform: none; box-shadow: none; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; }
  .steps li {
    font-family: var(--font-display); font-size: 0.85rem;
    padding: 4px 10px; border-radius: 999px;
    background: var(--card); color: var(--ink-soft); border: 2px solid var(--tile-line);
  }
  .steps li.current { border-color: var(--tomato); color: var(--tomato-dark); }
  .steps li.done { background: var(--ink); border-color: var(--ink); color: var(--card); }

  .stage-wrap { min-height: 0; display: grid; place-items: center; }
  .stage {
    position: relative;
    width: min(100%, 640px, calc((100dvh - 210px) * 1.25));
    aspect-ratio: 5 / 4; max-width: 100%;
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 6px 0 var(--tile-line);
    background: #f7fbf9;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute; inset: 0;
    display: flex;
    background: rgba(23, 66, 59, 0.35);
    padding: 16px; overflow-y: auto;
  }
  .overlay[hidden] { display: none; }
  .card {
    background: var(--card); border-radius: 16px;
    padding: 20px 22px; width: min(100%, 360px);
    display: grid; gap: 10px; text-align: center;
    box-shadow: 0 6px 0 rgba(23, 66, 59, 0.25);
    box-sizing: border-box; margin: auto;
  }
  .card.wide { width: min(100%, 440px); }
  .card h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; margin: 0; text-wrap: balance; }
  .card p { margin: 0; color: var(--ink-soft); line-height: 1.5; }
  .eyebrow { font-family: var(--font-display); font-size: 0.85rem; letter-spacing: 0.08em; color: var(--tomato-dark); }
  .big { font-family: var(--font-display); font-size: 3rem; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .scores { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; text-align: left; }
  .scores li { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--tile-line); padding: 4px 0; }
  .scores b { font-family: var(--font-display); font-weight: 400; font-variant-numeric: tabular-nums; }
  .medal {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 auto;
    display: grid; place-items: center;
    font-family: var(--font-display); font-size: 1.1rem; color: var(--ink);
    border: 4px solid var(--card); box-shadow: 0 0 0 3px var(--ink);
  }
  button {
    font-family: var(--font-display); font-size: 1.25rem;
    color: #fff; background: var(--tomato);
    border: 0; border-radius: 12px; padding: 12px 18px;
    box-shadow: 0 4px 0 var(--tomato-dark);
    cursor: pointer;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tomato-dark); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  button.ghost { background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--tile-line); border: 2px solid var(--tile-line); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row button { flex: 1 1 140px; }

  .card.menu-card { width: min(100%, 600px); padding: 16px; gap: 8px; }
  .menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .chip { font-size: 0.95rem; padding: 6px 14px; border-radius: 999px; color: var(--ink); background: var(--card); border: 2px solid var(--tile-line); box-shadow: none; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--card); }
  .chip:active { transform: none; box-shadow: none; }
  .dish {
    display: grid; grid-template-columns: 48px 1fr; align-items: center; gap: 10px;
    text-align: left; color: var(--ink); background: var(--card);
    border: 2px solid var(--tile-line); box-shadow: 0 3px 0 var(--tile-line);
    padding: 6px 10px; min-width: 0;
  }
  .dish:active { box-shadow: 0 1px 0 var(--tile-line); }
  .dish canvas { width: 48px; height: 48px; }
  .dish-name { font-family: var(--font-display); font-size: 1.15rem; display: block; line-height: 1.2; }
  .dish-meta { font-family: var(--font-body); font-size: 0.8rem; color: var(--ink-soft); display: block; }
  .dish-meta b { font-family: var(--font-display); font-weight: 400; color: var(--tomato-dark); font-variant-numeric: tabular-nums; }

  .host { display: flex; align-items: center; gap: 12px; }
  .host svg { flex: none; width: 64px; height: 64px; }
  .bubble {
    position: relative; min-width: 0; flex: 1;
    background: var(--card); border-radius: 14px; padding: 10px 14px;
    font-size: 1.02rem; line-height: 1.45;
    box-shadow: 0 3px 0 var(--tile-line);
  }
  .bubble::before {
    content: ""; position: absolute; left: -8px; top: 50%; margin-top: -8px;
    border: 8px solid transparent; border-left: 0; border-right-color: var(--card);
  }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>

<div class="app">
  <header class="top">
    <div>
      <div class="brand">지원 키친</div>
      <div class="recipe" id="recipe">메뉴를 골라 주세요</div>
    </div>
    <div class="top-right">
      <ol class="steps" id="steps"></ol>
      <button id="btn-music" class="music-btn" type="button">♪ 숲길</button>
    </div>
  </header>

  <div class="stage-wrap">
    <div class="stage">
      <canvas id="cv" aria-label="요리 화면"></canvas>
      <div class="overlay" id="ov"></div>
    </div>
  </div>

  <div class="host">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M14 22c-6-1-8-9-2-12 2-6 10-7 13-3 3-5 12-5 15 0 4-3 11-1 11 5 6 2 5 11-1 11z" fill="#fff" stroke="#17423b" stroke-width="2"/>
      <rect x="16" y="20" width="32" height="6" rx="2" fill="#fff" stroke="#17423b" stroke-width="2"/>
      <circle cx="32" cy="42" r="17" fill="#ffd9a8" stroke="#17423b" stroke-width="2"/>
      <circle cx="25" cy="40" r="2.2" fill="#17423b"/>
      <circle cx="39" cy="40" r="2.2" fill="#17423b"/>
      <ellipse cx="21" cy="47" rx="3" ry="2" fill="#ff9c86"/>
      <ellipse cx="43" cy="47" rx="3" ry="2" fill="#ff9c86"/>
      <path id="mouth" d="M27 47q5 5 10 0" fill="none" stroke="#17423b" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="bubble" id="bubble">안녕하세요! 저는 고모리예요. 오늘은 뭘 만들어 볼까요?</div>
  </div>
</div>

<script>
(() => {
  const W = 500, H = 400;
  const cv = document.getElementById("cv");
  let ctx = cv.getContext("2d");
  const mainCtx = ctx;
  const ov = document.getElementById("ov");
  const bubble = document.getElementById("bubble");
  const mouth = document.getElementById("mouth");
  const stepsEl = document.getElementById("steps");
  const recipeEl = document.getElementById("recipe");

  const MOUTHS = { happy: "M26 46q6 7 12 0", smile: "M27 47q5 5 10 0", oops: "M27 50q5 -4 10 0" };
  function say(text, mood = "smile") {
    bubble.textContent = text;
    mouth.setAttribute("d", MOUTHS[mood] || MOUTHS.smile);
  }

  // ---------- sound (starts only after a tap) ----------
  let actx = null;
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  function getCtx() {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function beep(freq = 660, dur = 0.08, type = "sine", vol = 0.08) {
    try {
      getCtx();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // ---------- best scores (this browser only) ----------
  function loadBest() { try { return JSON.parse(localStorage.getItem("gomori-best") || "{}"); } catch (e) { return {}; } }
  function saveBest(id, score) {
    const b = loadBest();
    if (!(b[id] >= score)) { b[id] = score; try { localStorage.setItem("gomori-best", JSON.stringify(b)); } catch (e) {} }
  }

  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function mixColor(c1, c2, t) {
    const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
    const a = p(c1), b = p(c2);
    return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], t))).join(",") + ")";
  }
  function timerBar(frac) {
    rr(20, 14, W - 40, 12, 6); ctx.fillStyle = "#e3eee9"; ctx.fill();
    const w = Math.max(0, (W - 40) * (1 - frac));
    if (w > 1) { rr(20, 14, w, 12, 6); ctx.fillStyle = frac > 0.75 ? "#ff6b4a" : "#4caf6a"; ctx.fill(); }
  }
  function label(text, x, y, size = 18, color = "#17423b") {
    ctx.font = size + 'px "Jua", system-ui, sans-serif';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = color; ctx.fillText(text, x, y);
  }
  function seeded(seed) { return () => ((seed = (seed * 9301 + 49297) % 233280) / 233280); }

  const floats = [];
  function pop(text, x, y, color = "#ff6b4a") { floats.push({ text, x, y, life: 1, color }); }
  function drawFloats(dt) {
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life -= dt * 1.2; f.y -= dt * 40;
      if (f.life <= 0) { floats.splice(i, 1); continue; }
      ctx.globalAlpha = clamp(f.life * 1.5, 0, 1);
      ctx.font = '30px "Jua", system-ui, sans-serif';
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.lineWidth = 6; ctx.strokeStyle = "#fff"; ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    }
  }
  function judge(score) {
    if (score >= 90) return ["완벽!", "#ff6b4a"];
    if (score >= 70) return ["좋아요!", "#4caf6a"];
    if (score >= 40) return ["괜찮아요", "#d49a00"];
    return ["아쉬워요", "#7a8f89"];
  }

  // ================= minigames =================

  // ---------- chop: swipe down along dotted lines ----------
  const CHOP = {
    tomato: { name: "토마토 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 토마토를 썰어요. 점선에 가까울수록 점수가 높아요.",
      stops: [[0, "#ff7a6b"], [1, "#e8384f"]], edge: "#b52a3a", h: 66, roots: false },
    cabbage: { name: "배추 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 배추를 썰어요. 만두 속에 들어갈 거예요.",
      stops: [[0, "#f4fbe9"], [0.5, "#d2ecb0"], [1, "#8fcf6a"]], edge: "#6aa34a", h: 64, roots: false },
    onion: { name: "대파 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 대파를 썰어요. 점선에 가까울수록 점수가 높아요.",
      stops: [[0, "#f6fbf2"], [0.18, "#d9efc0"], [0.35, "#7cc46a"], [1, "#3f9a4f"]], edge: "#2f7a3e", h: 38, roots: true },
    fishcake: { name: "어묵 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 어묵을 썰어요. 점선에 가까울수록 점수가 높아요.",
      stops: [[0, "#f3d6a4"], [1, "#e4b46f"]], edge: "#b27a3c", h: 62, roots: false },
    carrot: { name: "당근 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 당근을 썰어요. 점선에 가까울수록 점수가 높아요.",
      stops: [[0, "#ffc285"], [1, "#f2832f"]], edge: "#c4621d", h: 34, roots: false },
    potato: { name: "감자 썰기", intro: "껍질 깐 감자를 점선 따라 위에서 아래로 쓱 썰어요. 길쭉하게 썰어야 감자튀김이 돼요.",
      stops: [[0, "#fbefc6"], [1, "#f1dc96"]], edge: "#c9a85a", h: 74, roots: false },
    pepper: { name: "피망 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 피망을 썰어요. 점선에 가까울수록 점수가 높아요.",
      stops: [[0, "#8fd27e"], [1, "#3f9a4f"]], edge: "#2f7a3e", h: 50, roots: false },
    banana: { name: "바나나 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 바나나를 썰어요. 점선에 가까울수록 점수가 높아요.",
      stops: [[0, "#c9a227"], [0.08, "#ffe066"], [0.92, "#ffe066"], [1, "#8a6a1a"]], edge: "#c9a227", h: 44, roots: false },
    onionWhite: { name: "양파 썰기", intro: "점선 위를 위에서 아래로 쓱 그어서 양파를 썰어요. 눈이 맵기 전에 빨리 썰어요!",
      stops: [[0, "#fbf6fb"], [1, "#eadff0"]], edge: "#b9a3c7", h: 70, roots: true },
    gimbap: { name: "김밥 썰기", intro: "다 말린 김밥을 점선 따라 위에서 아래로 쓱 썰어요. 예쁘게 썰수록 점수가 높아요.",
      stops: [[0, "#1f3324"], [1, "#2c4632"]], edge: "#0f1a12", h: 60, roots: false },
  };
  function makeChop(cfg) {
    const LINES = [150, 195, 240, 285, 330, 375];
    const LIMIT = 15;
    let cut, accs, misses, t, trail, start, done;
    function finishChop() {
      done = true;
      const sum = accs.reduce((a, b) => a + b, 0);
      finish(Math.round(clamp((sum / LINES.length) * 100 - misses * 5, 0, 100)));
    }
    return {
      name: cfg.name, intro: cfg.intro,
      init() { cut = LINES.map(() => false); accs = []; misses = 0; t = 0; trail = []; start = null; done = false; },
      update(dt) {
        t += dt;
        trail.forEach(p => (p.life -= dt * 3));
        trail = trail.filter(p => p.life > 0);
        if (!done && t >= LIMIT) finishChop();
      },
      down(p) { start = p; trail.push({ ...p, life: 1 }); },
      move(p) { if (start) trail.push({ ...p, life: 1 }); },
      up(p) {
        if (!start || done) return;
        const dy = Math.abs(p.y - start.y), dx = Math.abs(p.x - start.x);
        const x = (p.x + start.x) / 2;
        start = null;
        if (dy < 35 || dx > 70) return;
        let best = -1, bd = 1e9;
        LINES.forEach((lx, i) => { if (!cut[i] && Math.abs(lx - x) < bd) { bd = Math.abs(lx - x); best = i; } });
        if (best >= 0 && bd < 22) {
          cut[best] = true;
          const acc = clamp(1 - Math.max(0, bd - 4) / 18, 0, 1);
          accs.push(acc);
          const [txt, col] = judge(acc * 100);
          pop(txt, LINES[best], 150, col);
          beep(500 + acc * 400, 0.07, "triangle");
          if (cut.every(Boolean)) finishChop();
        } else {
          misses++;
          pop("빗나감", x, 150, "#7a8f89");
          beep(180, 0.1, "square", 0.04);
        }
      },
      draw() {
        rr(40, 110, 420, 220, 22); ctx.fillStyle = "#e2b07a"; ctx.fill();
        ctx.strokeStyle = "#c48d55"; ctx.lineWidth = 3; ctx.stroke();
        for (let i = 0; i < 5; i++) {
          ctx.beginPath(); ctx.moveTo(60, 140 + i * 40); ctx.lineTo(440, 140 + i * 40 + 6);
          ctx.strokeStyle = "rgba(196,141,85,0.35)"; ctx.lineWidth = 2; ctx.stroke();
        }
        const top = 215 - cfg.h / 2;
        const bounds = [90, ...LINES.filter((_, i) => cut[i]), 420];
        const grad = ctx.createLinearGradient(90, 0, 420, 0);
        cfg.stops.forEach(([o, c]) => grad.addColorStop(o, c));
        let shift = -((bounds.length - 2) * 6) / 2;
        for (let k = 0; k < bounds.length - 1; k++) {
          rr(bounds[k] + shift + 1, top, bounds[k + 1] - bounds[k] - 2, cfg.h, k === 0 || k === bounds.length - 2 ? 12 : 5);
          ctx.fillStyle = grad; ctx.fill();
          ctx.strokeStyle = cfg.edge; ctx.lineWidth = 2; ctx.stroke();
          shift += 6;
        }
        if (cfg.roots) {
          ctx.strokeStyle = "#cdb98a"; ctx.lineWidth = 2;
          for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(84 - (bounds.length - 2) * 3, 205 + i * 7); ctx.lineTo(70 - (bounds.length - 2) * 3, 202 + i * 9); ctx.stroke(); }
        }
        ctx.setLineDash([6, 6]); ctx.lineWidth = 3; ctx.strokeStyle = "#17423b";
        LINES.forEach((lx, i) => { if (!cut[i]) { ctx.beginPath(); ctx.moveTo(lx, top - 20); ctx.lineTo(lx, top + cfg.h + 20); ctx.stroke(); } });
        ctx.setLineDash([]);
        if (trail.length > 1) {
          ctx.lineCap = "round";
          for (let i = 1; i < trail.length; i++) {
            ctx.strokeStyle = "rgba(160,180,190," + trail[i].life + ")";
            ctx.lineWidth = 8 * trail[i].life;
            ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
          }
        }
        timerBar(t / LIMIT);
        label("남은 점선 " + cut.filter(c => !c).length + "개", 250, 360, 20);
      },
    };
  }

  // ---------- egg: tap when the needle is in the green ----------
  function makeEgg(count) {
    let idx, phase, swing, pos, anim, scores, yolks;
    const slotX = i => count === 1 ? 250 : 220 + i * 60;
    return {
      name: "계란 깨기",
      intro: "바늘이 초록 칸 한가운데 올 때 화면을 톡 눌러 계란을 깨요. 계란은 " + count + "개예요.",
      init() { idx = 0; phase = "aim"; swing = 0; pos = 0; anim = 0; scores = []; yolks = []; },
      update(dt) {
        if (phase === "aim") { swing += dt * (2.4 + idx * 1.1); pos = (Math.sin(swing) + 1) / 2; }
        else if (phase === "crack") {
          anim += dt;
          if (anim > 0.9) {
            yolks.push({ x: slotX(idx), y: 312 });
            idx++;
            if (idx >= count) { phase = "end"; finish(Math.round(scores.reduce((a, b) => a + b, 0) / count)); }

  function makeStir(cfg) {
    const CX = 250, CY = 210, R = 150, NEED = cfg.need, LIMIT = 14;
    let bits, total, prevA, t, ptr, done;
    return {
      name: cfg.name, intro: cfg.intro,
      init() {
        bits = [];
        cfg.bits.forEach(([n, kind]) => { for (let i = 0; i < n; i++) bits.push({ r: Math.sqrt(Math.random()) * 118, a: Math.random() * Math.PI * 2, rot: Math.random() * 3, kind }); });
        bits.sort(() => Math.random() - 0.5);
        total = 0; prevA = null; t = 0; ptr = null; done = false;
      },
      update(dt) {
        if (done) return;
        t += dt;
        if (t >= LIMIT) { done = true; finish(Math.round(clamp((total / (NEED * Math.PI * 2)) * 60, 0, 60))); }
      },
      down(p) { ptr = p; prevA = null; this.move(p); },
      move(p) {
        if (!ptr || done) return;
        ptr = p;
        const dx = p.x - CX, dy = p.y - CY, dist = Math.hypot(dx, dy);
        if (dist > R + 50 || dist < 15) { prevA = null; return; }
        const a = Math.atan2(dy, dx);
        if (prevA !== null) {
          let d = a - prevA;
          if (d > Math.PI) d -= Math.PI * 2;
          if (d < -Math.PI) d += Math.PI * 2;
          const before = Math.floor(total / (Math.PI * 2));
          total += Math.abs(d);
          bits.forEach(b => { b.a += d * (0.35 + 0.5 * b.r / 118); });
          const after = Math.floor(total / (Math.PI * 2));
          if (after > before && after <= NEED) { pop(after + "바퀴!", CX, CY - 40, "#d49a00"); beep(520 + after * 80, 0.08, "triangle"); }
          if (total >= NEED * Math.PI * 2) {
            done = true;
            finish(t <= 6 ? 100 : Math.round(clamp(100 - (t - 6) * 7, 45, 100)));
          }
        }
        prevA = a;
      },
      up() { ptr = null; prevA = null; },
      draw() {
        const prog = clamp(total / (NEED * Math.PI * 2), 0, 1);
        if (cfg.vessel === "bowl") {
          ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.fillStyle = "#8cc6dd"; ctx.fill();
        } else if (cfg.vessel === "pot") {
          ctx.fillStyle = "#8fa3a0"; rr(CX - R - 30, CY - 12, 40, 24, 8); ctx.fill(); rr(CX + R - 10, CY - 12, 40, 24, 8); ctx.fill();
          ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.fillStyle = "#b9c9c6"; ctx.fill();
        } else {
          ctx.fillStyle = "#2d3a37";

        }
        ctx.beginPath(); ctx.arc(CX, CY, R - 14, 0, Math.PI * 2); ctx.fillStyle = mixColor(cfg.inner[0], cfg.inner[1], prog); ctx.fill();
        bits.forEach(b => {
          const k = KINDS[b.kind];
          const x = CX + Math.cos(b.a) * b.r, y = CY + Math.sin(b.a) * b.r;
          ctx.save(); ctx.translate(x, y); ctx.rotate(b.rot + b.a);
          ctx.fillStyle = mixColor(k.c0, k.c1, prog);
          if (b.kind === "rice") { ctx.beginPath(); ctx.ellipse(0, 0, 5, 2.6, 0, 0, Math.PI * 2); ctx.fill(); }
          else if (b.kind === "egg") { rr(-6, -4, 12, 8, 3); ctx.fill(); }
          else if (b.kind === "onion") { ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fillStyle = "#c7ecb5"; ctx.fill(); }
          else if (b.kind === "tteok") { rr(-14, -6, 28, 12, 6); ctx.fill(); ctx.strokeStyle = "rgba(0,0,0,0.12)"; ctx.lineWidth = 1.5; ctx.stroke(); }
          else if (b.kind === "fishcake") { ctx.beginPath(); ctx.moveTo(-10, 6); ctx.lineTo(10, 6); ctx.lineTo(0, -9); ctx.closePath(); ctx.fill(); }
          else if (b.kind === "noodle") { ctx.beginPath(); for (let i = 0; i <= 8; i++) ctx.lineTo(-16 + i * 4, Math.sin(i * 1.6) * 3); ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.stroke(); }
          else if (b.kind === "ham") { rr(-5, -5, 10, 10, 2); ctx.fill(); }
          else if (b.kind === "ketchupRice") { ctx.beginPath(); ctx.ellipse(0, 0, 5, 2.6, 0, 0, Math.PI * 2); ctx.fill(); }
          else if (b.kind === "bananaSlice") { ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "#e9cf6a"; ctx.lineWidth = 1.5; ctx.stroke(); }
          else if (b.kind === "berry") { drawItem("strawberry", 0, 0, 0.7); }
          else if (b.kind === "kiwi") { ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fillStyle = "#eef7d8"; ctx.fill(); ctx.fillStyle = "#1d2420"; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(Math.cos(i) * 5.5, Math.sin(i) * 5.5, 0.9, 0, Math.PI * 2); ctx.fill(); } }
          else if (b.kind === "seaweedFlake") { rr(-3, -3, 6, 6, 1); ctx.fill(); }
          else if (b.kind === "meat") { ctx.beginPath(); ctx.ellipse(0, 0, 6, 4, 0, 0, Math.PI * 2); ctx.fill(); }
          else if (b.kind === "cabbageBit") { rr(-6, -3, 12, 6, 2); ctx.fill(); }
          else if (b.kind === "tofu") { rr(-5, -5, 10, 10, 1); ctx.fill(); ctx.strokeStyle = "#e5e0cf"; ctx.lineWidth = 1; ctx.stroke(); }

          else if (b.kind === "lump") { const r = 6 * (1 - prog) + 0.5; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); }

        });

          ctx.beginPath(); ctx.arc(CX, CY, 80, 0, Math.PI * 1.7); ctx.stroke(); ctx.setLineDash([]);
          const ex = CX + Math.cos(Math.PI * 1.7) * 80, ey = CY + Math.sin(Math.PI * 1.7) * 80;
          ctx.beginPath(); ctx.moveTo(ex + 12, ey + 2); ctx.lineTo(ex - 4, ey - 10); ctx.lineTo(ex - 6, ey + 10); ctx.closePath(); ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.fill();
        }
        if (ptr) {
          const dx = ptr.x - CX, dy = ptr.y - CY;
          ctx.save(); ctx.translate(ptr.x, ptr.y); ctx.rotate(Math.atan2(dy, dx) + Math.PI / 2);
          if (cfg.vessel === "bowl") {
            ctx.strokeStyle = "#9aa8a6"; ctx.lineWidth = 3;
            for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.ellipse(0, 0, 8 + Math.abs(i) * 6, 16, 0, 0, Math.PI * 2); ctx.stroke(); }
            ctx.fillStyle = "#6d7d7a"; ctx.fillRect(-3, 14, 6, 70);
          } else {
            rr(-16, -14, 32, 28, 6); ctx.fillStyle = "#e9a15a"; ctx.fill();
            ctx.fillStyle = "#b8743a"; ctx.fillRect(-4, 12, 8, 70);
          }
          ctx.restore();
        }
        timerBar(t / LIMIT);
        label(Math.min(NEED, Math.floor(total / (Math.PI * 2))) + " / " + NEED + " 바퀴", 250, 385, 20);
      },
    };
  }

  function makePlace(cfg) {

      list.map(r =>
        '<button type="button" class="dish" id="dish-' + r.id + '"><canvas data-id="' + r.id + '" aria-hidden="true"></canvas>' +
        '<span><span class="dish-name">' + r.name + '</span><span class="dish-meta">' + r.level + " · " +
        (best[r.id] != null ? "최고 <b>" + best[r.id] + "</b>" : "도전!") + "</span></span></button>"
      ).join("") + "</div></div>");
    ov.querySelectorAll(".dish canvas").forEach(c => drawThumb(c, c.dataset.id));
    list.forEach(r => on("dish-" + r.id, () => startRecipe(r)));
    ["전체", ...LEVELS].forEach((l, i) => on("lv-" + i, () => { menuFilter = l; menu(); }));
  }

  function startRecipe(r) {
    recipe = r; steps = r.steps(); results = []; cur = -1;
    recipeEl.textContent = "오늘의 요리 · " + r.name;
    intro(0);
  }

  function intro(i) {
    cur = i; scene = steps[i]; scene.init(); running = false; renderSteps();
    say(scene.intro, "smile");
    show('<div class="card"><div class="eyebrow">' + recipe.name + " · " + (i + 1) + "단계</div><h2>" + scene.name + "</h2><p>" + scene.intro +
      '</p><button id="btn-go" type="button">시작!</button></div>');
    on("btn-go", () => { hide(); running = true; });
  }

  function finish(score) {
    if (!running) return;
    running = false;
    results[cur] = score;
    renderSteps();
    const [txt] = judge(score);
    const line = score >= 90 ? "완벽해요! 고모리도 깜짝 놀랐어요." :
                 score >= 70 ? "아주 잘했어요! 이 정도면 셰프예요." :
                 score >= 40 ? "괜찮아요, 조금만 더 연습해 봐요." :
                               "걱정 마세요, 고모리가 살짝 도와줄게요!";
    say(line, score >= 40 ? "happy" : "oops");
    setTimeout(() => {
      const last = cur === steps.length - 1;
      show('<div class="card"><div class="eyebrow">' + scene.name + '</div><div class="big">' + score + '<small style="font-size:1.2rem">점</small></div><h2>' + txt +
        '</h2><button id="btn-next" type="button">' + (last ? "완성 접시 보기" : "다음 단계") + "</button></div>");
      on("btn-next", () => { last ? result() : intro(cur + 1); });
    }, 700);
  }

  function result() {
    const id = recipe.id;
    scene = { draw() { DISHES[id](); } }; running = false; cur = steps.length; renderSteps();
    const total = Math.round(results.reduce((a, b) => a + b, 0) / steps.length);
    const prevBest = loadBest()[id];
    saveBest(id, total);
    const medal = total >= 90 ? ["금", "#ffcc4d", "금메달 셰프! 정말 맛있겠어요."] :
                  total >= 70 ? ["은", "#d6e0dd", "은메달! 다음엔 금메달도 가능해요."] :
                  total >= 50 ? ["동", "#e0a77a", "동메달! 맛있는 " + recipe.name + " 완성!"] :
                                ["참가", "#ffffff", "끝까지 완성했어요! 한 번 더 해 볼까요?"];
    const record = prevBest == null || total > prevBest;
    say(medal[2] + (record ? " 최고 기록이에요!" : ""), total >= 50 ? "happy" : "smile");
    show('<div class="card"><div class="eyebrow">완성 · ' + recipe.name + '</div><div class="medal" style="background:' + medal[1] + '">' + medal[0] +
      '</div><div class="big">' + total + '<small style="font-size:1.2rem">점</small></div><ul class="scores">' +
      steps.map((s, i) => "<li><span>" + s.name + "</span><b>" + results[i] + "</b></li>").join("") +
      '</ul><div class="btn-row"><button id="btn-again" type="button" class="ghost">다시 하기</button><button id="btn-menu" type="button">다른 요리</button></div></div>');
    on("btn-again", () => startRecipe(recipe));
    on("btn-menu", menu);
  }

  // ================= input =================
  function pt(e) {
    const r = cv.getBoundingClientRect();
    return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
  }
  cv.addEventListener("pointerdown", e => {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    if (running && scene.down) scene.down(pt(e));
  });
  cv.addEventListener("pointermove", e => { if (running && scene.move) scene.move(pt(e)); });
  const end = e => { if (running && scene.up) scene.up(pt(e)); };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);
  document.addEventListener("gesturestart", e => e.preventDefault());

  // ================= render loop =================
  function resize() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
  }
  window.addEventListener("resize", resize);
  resize();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    ctx = mainCtx;
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    ctx.fillStyle = "#f7fbf9"; ctx.fillRect(0, 0, W, H);
    const s = scene || kitchen;
    if (running && s.update) s.update(dt);
    s.draw();
    drawFloats(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- background music, played live with Web Audio ----------
  // two original tracks: "forest" (quiet piano + flute walk through the woods) and "jazz" (breezy swing)
  const music = (() => {
    const MODES = ["forest", "jazz", "off"];
    let mode = "forest";
    try { const v = localStorage.getItem("gomori-music"); if (MODES.includes(v)) mode = v; } catch (e) {}
    let playing = false, timer = null, master = null, noiseBuf = null, windGain = null, windFilter = null;
    let nextTime = 0, eighth = 0, bar = 0, melodyNote = 76;
    const BPM = 86, BEAT = 60 / BPM, SWING = 0.66;
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    // ii-V-I in C with a turnaround: Dm9 G13 Cmaj9 Am9 Fmaj9 Em7 Dm9 G9sus
    const CHORDS = [
      { root: 50, v: [53, 57, 60, 64] }, { root: 43, v: [53, 59, 64] },
      { root: 48, v: [52, 55, 59, 62] }, { root: 45, v: [55, 60, 64, 71] },
      { root: 41, v: [52, 57, 60, 67] }, { root: 40, v: [50, 55, 59, 64] },
      { root: 50, v: [53, 57, 60, 64] }, { root: 43, v: [53, 57, 60, 62] },
    ];
    const PENTA = [72, 74, 76, 79, 81, 84, 86];

    // forest track: 3/4 at 72 BPM, A minor, 16-bar loop (melody written for this game)
    const F_BEAT = 60 / 72;
    const F_CHORDS = {
      Am: [45, [57, 64, 69, 72, 69, 64]], F: [41, [53, 60, 65, 69, 65, 60]], C: [48, [55, 60, 64, 67, 64, 60]],
      G: [43, [55, 62, 67, 71, 67, 62]], Dm: [50, [57, 62, 65, 69, 65, 62]], E: [40, [56, 59, 64, 68, 64, 59]],
      Em: [40, [55, 59, 64, 67, 64, 59]], Cmaj7: [48, [55, 59, 64, 67, 64, 59]],
    };
    const F_PROG = ["Am", "F", "C", "G", "Am", "Dm", "E", "Am", "F", "G", "Em", "Am", "Dm", "G", "Cmaj7", "E"];
    const F_MELODY = [
      [[76, 2], [74, 1]], [[72, 2], [69, 1]], [[67, 1.5], [69, 0.5], [72, 1]], [[71, 3]],
      [[72, 1], [74, 1], [76, 1]], [[77, 2], [76, 1]], [[74, 1], [72, 1], [71, 1]], [[69, 3]],
      [[81, 2], [79, 1]], [[77, 2], [76, 1]], [[74, 1.5], [76, 0.5], [79, 1]], [[76, 3]],
      [[74, 1], [77, 1], [81, 1]], [[79, 2], [77, 1]], [[76, 1], [74, 1], [72, 1]], [[71, 2], [68, 1]],
    ];
    const F_NOTES = {};
    F_MELODY.forEach((bar, b) => { let pos = 0; bar.forEach(([m, d]) => { F_NOTES[b * 6 + pos * 2] = [m, d]; pos += d; }); });

    function env(g, t, peak, attack, decay) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    }
    function epiano(m, t, vel, decay = 1.9, cutoff = 2200) {
      const c = actx, g = c.createGain(), f = c.createBiquadFilter();
      f.type = "lowpass"; f.frequency.value = cutoff;
      [[1, 1], [2, 0.18], [3.01, 0.05]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), og = c.createGain();
        o.type = "sine"; o.frequency.value = mtof(m) * mul; og.gain.value = amp;
        o.connect(og).connect(f); o.start(t); o.stop(t + decay + 0.3);
      });
      f.connect(g).connect(master);
      env(g, t, vel, 0.015, decay);
    }
    function flute(m, t, dur) {
      const c = actx, o = c.createOscillator(), o2 = c.createOscillator(), g2 = c.createGain(), g = c.createGain();
      const vib = c.createOscillator(), vg = c.createGain(), f = c.createBiquadFilter();
      o.type = "sine"; o.frequency.value = mtof(m);
      o2.type = "triangle"; o2.frequency.value = mtof(m) * 2; g2.gain.value = 0.07;
      vib.frequency.value = 5; vg.gain.setValueAtTime(0, t); vg.gain.linearRampToValueAtTime(mtof(m) * 0.007, t + Math.min(0.5, dur * 0.6));
      vib.connect(vg); vg.connect(o.frequency);
      f.type = "lowpass"; f.frequency.value = 3000;
      o.connect(g); o2.connect(g2).connect(g); g.connect(f).connect(master);
      const end = t + Math.max(0.2, dur - 0.08);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.085, t + 0.09);
      g.gain.setValueAtTime(0.075, end);
      g.gain.exponentialRampToValueAtTime(0.0001, end + 0.35);
      [o, o2, vib].forEach(x => { x.start(t); x.stop(end + 0.4); });
    }
    function pad(notes, t, dur) {
      const c = actx, f = c.createBiquadFilter(), g = c.createGain();
      f.type = "lowpass"; f.frequency.value = 850;
      notes.forEach(m => [-6, 6].forEach(cents => {
        const o = c.createOscillator(); o.type = "sawtooth"; o.frequency.value = mtof(m); o.detune.value = cents;
        o.connect(f); o.start(t); o.stop(t + dur + 1.2);
      }));
      f.connect(g).connect(master);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.012, t + dur * 0.4);
      g.gain.linearRampToValueAtTime(0.0001, t + dur + 1.1);
    }
    function bass(m, t) {
      const c = actx, o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
      o.type = "triangle"; o.frequency.value = mtof(m);
      f.type = "lowpass"; f.frequency.value = 700;
      o.connect(f).connect(g).connect(master);
      env(g, t, 0.22, 0.01, BEAT * 0.95);
      o.start(t); o.stop(t + BEAT + 0.1);
    }
    function vibes(m, t) {
      const c = actx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), trem = c.createOscillator(), tg = c.createGain(), out = c.createGain();
      o.type = "sine"; o.frequency.value = mtof(m);
      o2.type = "sine"; o2.frequency.value = mtof(m) * 4; const g2 = c.createGain(); g2.gain.value = 0.06;
      trem.frequency.value = 5.2; tg.gain.value = 0.35; out.gain.value = 0.65;
      trem.connect(tg).connect(out.gain);
      o.connect(g); o2.connect(g2).connect(g);
      g.connect(out).connect(master);
      env(g, t, 0.075, 0.008, 1.6);
      [o, o2, trem].forEach(x => { x.start(t); x.stop(t + 1.8); });
    }
    function noise(t, dur, freq, q, peak, type = "bandpass") {
      const c = actx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
      s.connect(f).connect(g).connect(master);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + dur * 0.4);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.start(t, Math.random()); s.stop(t + dur + 0.05);
    }
    function startWind() {
      const c = actx, s = c.createBufferSource();
      s.buffer = noiseBuf; s.loop = true;
      windFilter = c.createBiquadFilter(); windFilter.type = "bandpass"; windFilter.frequency.value = 600; windFilter.Q.value = 0.8;
      windGain = c.createGain(); windGain.gain.value = 0.02;
      const lfo = c.createOscillator(), lg = c.createGain();
      lfo.frequency.value = 0.07; lg.gain.value = 350;
      lfo.connect(lg).connect(windFilter.frequency);
      s.connect(windFilter).connect(windGain).connect(master);
      s.start(); lfo.start();
    }
    function gust(t) {
      // a breeze passing through: swell up, sweep the filter, fade away
      windGain.gain.setTargetAtTime(0.07, t, 1.2);
      windGain.gain.setTargetAtTime(0.02, t + 3.5, 1.8);
      windFilter.Q.setTargetAtTime(2.2, t, 1.5);
      windFilter.Q.setTargetAtTime(0.8, t + 4, 2);
    }
    function scheduleEighth(t) {
      const ch = CHORDS[bar % CHORDS.length], nx = CHORDS[(bar + 1) % CHORDS.length];
      const beat = eighth >> 1, off = eighth & 1;
      if (!off) {
        const walk = [ch.root, ch.root + 7, ch.root + 5, nx.root + (Math.random() < 0.5 ? 1 : -1)];
        bass(walk[beat], t);
      }
      if (eighth === 0) ch.v.forEach((m, i) => epiano(m, t + i * 0.012, 0.045));
      if (eighth === 3 && Math.random() < 0.7) ch.v.forEach(m => epiano(m, t, 0.028));
      if (eighth === 2 || eighth === 6) noise(t, 0.22, 2800, 0.7, 0.035);
      noise(t, 0.06, 7000, 1, off ? 0.012 : 0.007, "highpass");
      if (Math.random() < (off ? 0.18 : 0.26)) {
        let i = PENTA.indexOf(melodyNote);
        i = clamp(i + [-2, -1, -1, 1, 1, 2][Math.floor(Math.random() * 6)], 0, PENTA.length - 1);
        melodyNote = PENTA[i];
        vibes(melodyNote, t);
      }
      if (eighth === 0 && bar % 4 === 2) gust(t);
    }
    function scheduleForest(t) {
      const name = F_PROG[bar % 16], [root, arp] = F_CHORDS[name];
      if (eighth === 0) {
        epiano(root, t, 0.07, 2.8, 1400);
        pad(arp.slice(0, 4).map(m => m + 12), t, F_BEAT * 3);
        if (bar % 8 === 4) gust(t);
      }
      epiano(arp[eighth], t + 0.004, eighth === 0 ? 0.04 : 0.028, 1.6, 1800);
      const mel = F_NOTES[(bar % 16) * 6 + eighth];
      if (mel && bar >= 2) flute(mel[0], t, mel[1] * F_BEAT);
    }
    function tick() {
      if (mode === "forest") {
        while (nextTime < actx.currentTime + 0.25) {
          scheduleForest(nextTime);
          nextTime += F_BEAT / 2;
          eighth++;
          if (eighth === 6) { eighth = 0; bar++; }
        }
        return;
      }
      while (nextTime < actx.currentTime + 0.25) {
        scheduleEighth(nextTime);
        const beatStart = nextTime - ((eighth & 1) ? BEAT * SWING : 0);
        if (eighth & 1) nextTime = beatStart + BEAT;
        else nextTime += BEAT * SWING;
        eighth++;
        if (eighth === 8) { eighth = 0; bar++; }
      }
    }
    function start() {
      if (playing || mode === "off") return;
      getCtx();
      if (!noiseBuf) {
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (!master) {
        const comp = actx.createDynamicsCompressor();
        master = actx.createGain(); master.gain.value = 0.0001;
        master.connect(comp).connect(actx.destination);
        startWind();
      }
      master.gain.cancelScheduledValues(actx.currentTime);
      master.gain.setTargetAtTime(0.55, actx.currentTime, 0.8);
      nextTime = actx.currentTime + 0.1; eighth = 0; bar = 0;
      timer = setInterval(tick, 60);
      playing = true;
    }
    function stop() {
      if (!playing) return;
      clearInterval(timer); timer = null; playing = false;
      master.gain.cancelScheduledValues(actx.currentTime);
      master.gain.setTargetAtTime(0.0001, actx.currentTime, 0.3);
    }
    function next() {
      mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
      try { localStorage.setItem("gomori-music", mode); } catch (e) {}
      stop();
      if (mode !== "off") start();
    }
    document.addEventListener("visibilitychange", () => {
      if (!actx) return;
      if (document.hidden) actx.suspend(); else actx.resume();
    });
    return { start, stop, next, mode: () => mode };
  })();

  const musicBtn = document.getElementById("btn-music");
  function renderMusicBtn() {
    const m = music.mode();
    musicBtn.textContent = { forest: "♪ 숲길", jazz: "♪ 재즈", off: "♪ 음악 끔" }[m];
    musicBtn.setAttribute("aria-label", "배경음악 바꾸기, 지금: " + musicBtn.textContent.slice(2));
    musicBtn.classList.toggle("on", m !== "off");
  }
  musicBtn.addEventListener("click", () => { music.next(); renderMusicBtn(); });
  renderMusicBtn();
  // browsers only allow sound after the first touch, so start the music then
  function firstGesture(e) {
    if (e.target === musicBtn) return;
    ["pointerdown", "touchend", "click"].forEach(t => document.removeEventListener(t, firstGesture, true));
    music.start();
  }
  ["pointerdown", "touchend", "click"].forEach(t => document.addEventListener(t, firstGesture, true));

  menu();
})();
</script>
